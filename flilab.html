/* Sehr schmale Handys (320 px): Die sieben Spalten passen nur mit 13 px Schrift und engem Abstand ohne Wischen; Kopfzeile und Knöpfe bleiben bei 14 px */
@media(max-width:340px){.tw .rvt td{padding:7px 1px;font-size:13px}.tw .rvt th{padding:7px 1px}.rvt .chip{padding:0 2px}}
.dsl{display:flex;gap:10px;align-items:center}.dsl input[type=range]{flex:1}
/* Platz für den Vorlesen-Knopf (kommt nachgeladen direkt hinter den Auftrag): gleiche Höhe und Abstände wie .au-wrap (Knopf 44 px + 2 x 2 px), verschwindet, sobald der Knopf davor steht */
.au-slot{height:48px;margin:2px 0 4px}.au-wrap+.au-slot{display:none}
/* Rückmelde- und Weiter-Leiste immer über der Bedienleiste #pal (Werte aus fliui.js dock(); ohne Wert: übliche Höhe der Bedienleiste) */
#fbStrip{bottom:calc(12px + var(--flidock,58px) + env(safe-area-inset-bottom))!important}
#wtBar{bottom:calc(12px + var(--flidock,58px) + var(--flifb,0px) + env(safe-area-inset-bottom))!important}
/* Mindestgrößen: Schrift ab 14 px, Bedienelemente ab 44 px */
header .title small{font-size:14px}
.hb{height:44px;min-width:44px;justify-content:center;border-radius:22px}
.tab{height:44px;border-radius:22px}
.chip,.chip.s{height:44px;border-radius:22px;font-size:14px}
.seg{flex-wrap:wrap;gap:6px;border:0;border-radius:0;overflow:visible}
.seg button,.seg button:last-child{height:44px;font-size:14px;padding:0 14px;border:1px solid var(--line);border-radius:22px}
.seg button.on{border-color:var(--accent-bg)}
.ib{width:44px;height:44px}
.dot,.dot.p,.tab .bd{font-size:14px}.tab .bd{min-width:22px;height:22px;border-radius:11px}
#stat,.lv,.hint2,.gh,.card.pl h4,label.f span{font-size:14px}
.hint2{line-height:1.45}
#toast{font-size:15px}
sub,sup{font-size:14px;line-height:0}
#urheber-hinweis{font-size:14px!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}</style>
