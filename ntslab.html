<style>
#presetBar .chip{white-space:normal;height:auto;min-height:40px;padding-top:6px;padding-bottom:6px;text-align:left;line-height:1.2}
.kvs{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;padding:4px 0;min-height:30px}.kvs>span:first-child{color:var(--mute)}
.rbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;align-items:center}
.rbar::-webkit-scrollbar{display:none}
#cvw{position:relative;background:var(--cv);overflow:hidden;width:100%;aspect-ratio:1000/640;max-height:62vh;border-radius:12px;border:1px solid var(--line)}
.scope{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px 8px}
.scbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:2px 0 6px}
.scinfo{color:var(--mute);font-size:12.5px;margin-left:auto}
.chartbox{position:relative}
.chartbox canvas{width:100%;height:auto;background:var(--well);border:1px solid var(--line);border-radius:10px;touch-action:none}
.scrub{margin:4px 0 0}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px;margin-top:10px}
.mt .qi{position:absolute;right:6px;top:5px;font-size:12px;color:var(--accent);font-weight:700;width:18px;height:18px;border-radius:9px;border:1px solid var(--accent);display:grid;place-items:center}
.mt .gg{position:relative;height:5px;border-radius:3px;background:var(--well);margin-top:3px;overflow:hidden}.mt .gg i{position:absolute;top:0;bottom:0;left:0;background:var(--accent)}.mt .gg b{position:absolute;top:0;bottom:0;width:2px;background:var(--warn);opacity:.9}
.mt.warn .gg i{background:var(--danger)}
.ct .ctl .lb{display:flex;align-items:center;gap:6px;min-width:0}
.ct .un{color:var(--mute);font-size:12px;min-width:26px}
.ct .seg.wrap{flex-wrap:wrap;border-radius:14px}.ct .seg.wrap button{flex:1 1 30%;border-bottom:1px solid var(--line)}
.rl{display:grid;gap:10px;margin-top:10px}
.fmb{padding:0 12px 12px}
.hl a{display:inline-block;padding:10px 2px}#mid[data-tab=rig] #pgRig,#mid[data-tab=wave] #pgWave,#mid[data-tab=curve] #pgCurve,#mid[data-tab=design] #pgDesign,#mid[data-tab=calc] #pgCalc,#mid[data-tab=tasks] #pgTasks,#mid[data-tab=help] #pgHelp{display:flex}
/* ---- Netzteil-Lab: Ampel, Hinweisband, Blockschaltbild, Vorher/Nachher, Bedienpult nach Stufen (Farben je Thema aus NTS_DRAW.PAL, hier nur Rueckfall) ---- */
:root{--amp-ok:#4cd964;--amp-warn:#ffb340;--amp-bad:#ff5c5c;--lc:#8d99a6}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--amp-ok:#15803d;--amp-warn:#854d0e;--amp-bad:#b91c1c}}
:root[data-theme=light]{--amp-ok:#15803d;--amp-warn:#854d0e;--amp-bad:#b91c1c}
#rigPick{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
#rigPick::-webkit-scrollbar{display:none}
#rigPick .chip{height:auto;min-height:44px;padding-top:4px;padding-bottom:4px;flex-direction:column;gap:0;line-height:1.15}
#rigPick .chip small{font-size:12px;color:inherit;opacity:.85}
#rigPick .chip.miss{opacity:.55}
.simband{display:flex;align-items:flex-start;gap:8px;border:2px solid var(--amp-warn);border-radius:12px;padding:6px 6px 6px 12px;margin:0 0 8px;background:var(--panel);font-size:13px;line-height:1.35}
.simband[hidden]{display:none}.simband span{flex:1;min-width:0;padding-top:6px}.simband .chip{flex:none}
.amprow{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 0 8px;background:var(--panel)}
.amprow.ok{border-color:var(--amp-ok)}.amprow.warnc{border-color:var(--amp-warn)}.amprow.bad{border-color:var(--amp-bad)}
.asym{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800;background:var(--panel2);border:2px solid currentColor;color:var(--mute)}
.amprow.ok .asym{color:var(--amp-ok)}.amprow.warnc .asym{color:var(--amp-warn)}.amprow.bad .asym{color:var(--amp-bad)}
.atx{min-width:0;display:flex;flex-direction:column}.atx b{font-size:15px}.atx small{color:var(--mute);font-size:12.5px;line-height:1.3}.atx .nt{color:var(--fg);opacity:.85}
.avs{margin-left:auto;display:flex;flex-direction:column;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:600px){.avs{display:none}}
#blkBox{margin:0 0 8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px 4px}
#blk{width:100%;height:170px;border-radius:8px}
#blkTx{font-size:12.5px;color:var(--mute);padding:4px 2px 2px;line-height:1.4}
#blkTx b{color:var(--fg)}
#pfadBar{font-size:12.5px;padding:2px 2px 4px;color:var(--mute);line-height:1.4}
#pfadBar b{color:var(--fg)}
.sb{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:var(--lc);color:#111;font-style:normal;font-weight:800;font-size:12px;flex:none}
#diceBar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border:2px solid var(--amp-warn);border-radius:12px;padding:6px 10px;margin:0 0 8px;background:var(--panel);font-size:13.5px}
#diceBar[hidden]{display:none}#diceBar b{flex:1 1 200px}
#cvw{aspect-ratio:1000/560;max-height:56vh;touch-action:none}
#wipeBar{position:absolute;top:0;bottom:0;left:var(--wp,50%);width:56px;transform:translateX(-50%);cursor:ew-resize;touch-action:none;z-index:3}
#wipeBar::before{content:"";position:absolute;top:0;bottom:0;left:27px;width:2px;background:var(--accent)}
#wipeBar::after{content:"\2194";position:absolute;top:50%;left:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--accent-bg,#1a6fd4);color:var(--on-accent);display:grid;place-items:center;font-size:16px}
#wipeBar[hidden]{display:none}
.barow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 0}
#qLine{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--mute);padding:2px 2px 6px}
#qLine b{color:var(--fg)}
#qLine .seg button{min-height:40px}
#linkBar{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 6px}#linkBar:empty{display:none}
#linkBar .btn{min-height:44px;font-size:13.5px}
.ctg{border-left:4px solid var(--lc)}
.ctg>summary{color:var(--lc)}
.ctg>summary .sb{margin-right:2px}
.ct .hp{font-weight:400}
.bdg{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:10px;padding:0 7px;font-size:12px;font-weight:700;white-space:nowrap;vertical-align:middle;color:var(--mute)}
.bdg.ok{color:var(--ok);border-color:var(--ok)}.bdg.uw{color:var(--warn);border-color:var(--warn)}
.lim{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;align-items:baseline;padding:6px 10px;border-top:1px solid var(--line);font-size:13px}.lim:first-child{border-top:0}.lim>span{min-width:0;overflow-wrap:anywhere}.lim small{flex:1 1 100%;color:var(--mute);font-size:12px}
button.bt{display:flex;align-items:center;justify-content:center;width:calc(100% - 20px);margin:6px 10px;min-height:48px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:14px}
button.bt:active{background:var(--accent-bg,#1a6fd4);border-color:var(--accent-bg,#1a6fd4);color:var(--on-accent)}
.chip.fire{background:var(--accent-bg,#1a6fd4);border-color:var(--accent-bg,#1a6fd4);color:var(--on-accent);font-weight:700}
.ev li.warn .dk{color:var(--warn)}.ev li.error .dk{color:var(--bad-fg)}.dk{flex:none;width:16px;text-align:center;font-weight:800}
.cmpt{overflow-x:auto}
.sqr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 4px;border-top:1px solid var(--line)}
.sqr .n{width:22px;color:var(--mute);text-align:center;font-size:13px}
.sqr input,.sqr select{width:auto;min-height:40px;padding:7px 8px}
.sqr .tIn{width:78px}.sqr .vIn{width:96px}.sqr select{min-width:110px;flex:1 1 120px}
.sqr .ib2{width:40px;height:40px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:15px;display:inline-grid;place-items:center}
.fl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px 0}
.fl select,.fl input{width:auto;min-height:40px;padding:7px 8px;flex:1 1 90px}
.nts-tbl{margin:8px 0;overflow-x:auto;max-width:100%}.nts-tbl table{border-collapse:collapse;font-size:13.5px;min-width:60%}.nts-tbl caption{caption-side:top;text-align:left;color:var(--mute);font-size:12px;padding:0 0 3px}.nts-tbl th,.nts-tbl td{border:1px solid var(--line);padding:5px 9px;text-align:left}.nts-tbl th{background:var(--panel2);font-size:12px}
@media(max-width:600px){#blk{height:210px}}
</style>

        <details class="card" id="cDiag" open><summary>Hinweise zur Anlage</summary><div class="cb"><ul class="ev" id="diagList"></ul></div></details>

      </div>
    </section>
    <section class="pg scroll" id="pgWave"><div class="wrap" id="waveView"></div></section>
    <section class="pg scroll" id="pgCurve"><div class="wrap" id="curveView"></div></section>

    <section class="pg scroll" id="pgTasks"><div class="wrap" id="taskView"></div></section>
