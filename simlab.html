<div id="app">
  <header>
    <button class="ib" id="bMenu" aria-label="Menü"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><a class="ib" id="bHome" href="index.html" aria-label="Startseite" title="Startseite" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none"><svg class="i" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5M6.5 10v9h4v-5h3v5h4v-9"/></svg></a>
    <img id="logo" onclick="location.href='index.html'" title="Startseite" style="cursor:pointer" src="logo.png" alt="Tonfunk" onerror="this.remove()">
    <div class="title" id="title">Schaltplan</div>
    <button class="hb" id="bEx" aria-label="Beispielschaltungen">📖 <span>Beispiele</span></button>
    <button class="hb" id="bOpen" aria-label="Gespeicherte Schaltungen">📂 <span>Öffnen</span></button>
    <button class="hb" id="bTasks" style="display:none" aria-label="Aufgaben">📝 <span>Aufgaben</span></button>
    <button class="hb" id="bCab" style="display:none" aria-label="Schaltschrank">🗄 <span>Schrank</span></button>
    <button class="hb" id="bPP" style="display:none" aria-label="Prüfplatz VDE 0701 0702">🔌 <span>Prüfplatz</span></button>
    <button class="hb" id="bShare" aria-label="Teilen">📤 <span>Teilen</span></button>
    <button class="hb" id="bPrint" aria-label="Drucken">🖨 <span>Drucken</span></button>
    <button class="ib" id="bUndo" aria-label="Rückgängig"><svg class="i" viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 010 10h-3" transform="translate(0 -3)"/></svg></button>
    <button class="ib" id="bRedo" aria-label="Wiederholen"><svg class="i" viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 000 10h3" transform="translate(0 -3)"/></svg></button>
    <button class="run" id="bRun" aria-label="Start">▶</button>
  </header>
  <div id="mid">
    <aside id="parts"></aside>
    <main><canvas id="cv"></canvas></main>
    <aside id="side"></aside>
  </div>
  <div id="pal"></div>
</div>
<div id="toast"></div>
<div id="printArea"><img id="printImg" alt=""></div>
