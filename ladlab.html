<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ladungssicherungs-Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Tonfunk Ladungssicherungs-Lab</title>
<script>/* Darstellung: Auto / Hell / Dunkel; Schlüssel lm4.theme wie die Startseite (nur der Umschalter dort schreibt ihn) */
(function(){try{var v=localStorage.getItem('lm4.theme');if(v==='light'||v==='dark')document.documentElement.setAttribute('data-theme',v);}catch(e){}})();</script>
<style>
:root{--bg:#14181c;--panel:#222830;--panel2:#2c343e;--fg:#e8ecf0;--mute:#8d99a6;--accent:#3b9eff;--accent-bg:#1a6fd4;--danger:#ff5c5c;--line:#38424d;--ok:#4cd964;--warn:#ffb340;--hi:#ff9f1c;--work:rgba(59,158,255,.35);color-scheme:dark}
/* Hell-Modus: automatisch nach System, Umschalter der Startseite setzt data-theme (lm4.theme) */
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f3f5f8;--panel:#ffffff;--panel2:#eaeef3;--line:#d3d9e0;--fg:#141a21;--mute:#5a6672;--accent:#0a4fb3;--accent-bg:#0a4fb3;--ok:#107a3f;--warn:#8a5a00;--danger:#b3261e;--hi:#c25e00;--work:rgba(10,79,179,.25);color-scheme:light}}
:root[data-theme=light]{--bg:#f3f5f8;--panel:#ffffff;--panel2:#eaeef3;--line:#d3d9e0;--fg:#141a21;--mute:#5a6672;--accent:#0a4fb3;--accent-bg:#0a4fb3;--ok:#107a3f;--warn:#8a5a00;--danger:#b3261e;--hi:#c25e00;--work:rgba(10,79,179,.25);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.3 -apple-system,system-ui,"Segoe UI",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:4px;padding:calc(4px + env(safe-area-inset-top)) 8px 4px;background:var(--panel);border-bottom:1px solid var(--mute);min-height:52px;box-shadow:0 3px 10px rgba(0,0,0,.35);position:relative;z-index:5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
header img{height:34px;margin-left:2px}
header .title{flex:1;min-width:0;padding:0 8px;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .title small{display:block;color:var(--fg);opacity:.78;font-weight:500;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button[disabled]{opacity:.35;cursor:default}
.ib{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:20px;color:inherit}
.ib:active,.chip:active{background:var(--panel2)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hb{height:38px;padding:0 12px;border-radius:19px;background:var(--panel2);border:1px solid var(--mute);font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;margin:0 2px;flex:none}
.hb:active{background:var(--panel)}
.hb.on{background:var(--accent-bg);border-color:var(--accent-bg);color:#fff}
@media(max-width:1100px){.hb span{display:none}.hb{padding:0 10px}}
@media(max-width:600px){header img,#bHome,#bExam,#bHelp{display:none}}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:7px 10px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:40px;padding:0 15px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font:600 14px system-ui;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tab.on{background:var(--accent-bg,#1a6fd4);border-color:var(--accent-bg,#1a6fd4);color:#fff}
.tab .bd{min-width:18px;height:18px;border-radius:9px;background:#0003;font-size:12px;display:inline-grid;place-items:center;padding:0 5px}
#mid{display:flex;flex:1;min-height:0;position:relative}
.pg{display:none;flex-direction:column;min-width:0;min-height:0;flex:1;overflow:hidden}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:12px 12px 30px}
#pal{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);min-height:54px;scrollbar-width:thin;flex:none}
.chip{flex:none;height:40px;padding:0 13px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font-size:14px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip.on{background:var(--accent-bg,#1a6fd4);border-color:var(--accent-bg,#1a6fd4);color:#fff}
.chip.s{height:34px;padding:0 11px;font-size:13px;min-width:44px;justify-content:center}
.seg{display:inline-flex;flex:none;border-radius:20px;overflow:hidden;border:1px solid var(--line);max-width:100%}
.seg button{height:40px;min-width:44px;padding:0 12px;background:var(--panel2);font-size:14px;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}.seg button.on{background:var(--accent-bg,#1a6fd4);color:#fff;font-weight:600}
#stat{flex:none;font-size:12.5px;color:var(--mute);padding:0 4px;white-space:nowrap;font-variant-numeric:tabular-nums}
#stat b{color:var(--fg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0;margin-bottom:10px;overflow:hidden}
.card.pl{padding:12px}.card.pl h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:600;text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--accent-bg,#1a6fd4);border-color:var(--accent-bg,#1a6fd4);color:#fff}.btn.danger{color:var(--danger)}
.btns{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.btns .btn{flex:1;min-width:120px}
.tl{list-style:none;margin:10px 0 0;padding:0;font-size:14px}.tl li{padding:5px 0 5px 2px;line-height:1.4}.tl li.ok{color:var(--ok)}.tl li.bad{color:var(--danger)}
.gh{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);padding:14px 6px 4px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);min-height:48px;border-radius:0}.row:last-child{border:0}.row:active{background:var(--panel2)}
.row small{display:block;color:var(--mute);margin-top:1px}.row .grow{flex:1;min-width:0}
.dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px}.dot.g{background:var(--ok);border-color:var(--ok);color:#06210d}.dot.p{border-color:var(--warn);color:var(--warn);font-size:10px;font-weight:700}
.lv{color:var(--warn);letter-spacing:1px;font-size:12px}
.hint2{color:var(--mute);font-size:13px;margin:6px 0 0;line-height:1.4}
.big{font-size:20px;font-weight:700;margin:0 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:44px;-webkit-user-select:text;user-select:text}
input[type=range]{padding:0;min-height:44px;accent-color:var(--accent-bg);background:none;border:0}
label.f{display:block;margin:0 0 10px}label.f span{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;color:#fff;padding:9px 16px;border-radius:99px;z-index:300;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:700px){.backdrop{align-items:center}.sheet{border-radius:16px}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 6px 16px;border-bottom:1px solid var(--line);font-size:16px}
.sh-h button{width:44px;height:44px;font-size:18px;color:var(--mute)}
.sh-b{overflow:auto;padding:10px 14px 16px;-webkit-user-select:text;user-select:text}
#gate{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#gate form{width:100%;max-width:340px;text-align:center}
#gate img{width:96px;height:auto;margin-bottom:10px}
#gate h1{margin:0 0 4px;font-size:22px}
#gate p{margin:0 0 18px;color:var(--mute)}
#gate input{text-align:center;margin-bottom:12px}
#gate .btn{width:100%}
#gateErr{margin-top:12px;min-height:20px;color:var(--danger);font-size:14px}
@media print{#app,.backdrop,#toast,#gate,#verBadge{display:none!important}body{background:#fff;height:auto}html{height:auto}}
/* ===== Ladungssicherungs-Lab ===== */
#mid[data-tab=kr] #pgKr,#mid[data-tab=lade] #pgLade,#mid[data-tab=stap] #pgStap,#mid[data-tab=art] #pgArt,#mid[data-tab=gg] #pgGg,#mid[data-tab=sym] #pgSym,#mid[data-tab=ver] #pgVer,#mid[data-tab=tasks] #pgTasks,#mid[data-tab=rt] #pgRt,#mid[data-tab=bsp] #pgBsp,#mid[data-tab=help] #pgHelp{display:flex}
.inst{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0}
.inst svg{display:block;width:100%;height:auto}
.inst svg text{font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none}
.g-ax{stroke:var(--mute);stroke-width:1}.g-grid{stroke:var(--line);stroke-width:.6}
.g-lab{fill:var(--fg);font-size:11px}.g-lab.m{fill:var(--mute)}
.g-saw{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round}
.g-meld{stroke:var(--hi);stroke-width:1.6;stroke-dasharray:6 4}.g-sich{stroke:var(--danger);stroke-width:1.6;stroke-dasharray:6 4}.g-max{stroke:var(--ok);stroke-width:1.4;stroke-dasharray:2 4}
.g-lead{fill:var(--hi);opacity:.16}
.g-cb{fill:none;stroke:var(--accent);stroke-width:2}.g-cl{fill:none;stroke:var(--hi);stroke-width:2}.g-cg{fill:none;stroke:var(--ok);stroke-width:3}
.g-opt{stroke:var(--fg);stroke-width:1;stroke-dasharray:3 3}
.cA{fill:#e5484d}.cB{fill:#f5a524}.cC{fill:#3b9eff}
.cl-A{background:rgba(229,72,77,.2);border-color:#e5484d;color:var(--fg)}.cl-B{background:rgba(245,165,36,.2);border-color:#f5a524;color:var(--fg)}.cl-C{background:rgba(59,158,255,.2);border-color:#3b9eff;color:var(--fg)}
.fbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.rdout{background:var(--bg);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 12px;margin:8px 0;font-size:14px;line-height:1.45}
.rdout.bad{border-color:var(--danger)}.rdout.ok{border-color:var(--ok)}.rdout.warn{border-color:var(--warn)}
.rdout b{color:var(--accent)}
.rdout .st{display:block;color:var(--mute);font-size:12.5px}
.stats{display:flex;gap:8px;margin:0 0 10px}
.stats .bx{flex:1;text-align:center;font-size:12px;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 2px}
.stats .bx b{display:block;font-size:20px;color:var(--fg)}
.opts{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.opts button{text-align:left;min-height:46px;padding:9px 12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);font-size:14.5px;line-height:1.3}
.opts button.on{border-color:var(--accent);background:rgba(59,158,255,.2)}
.opts button.ok{border-color:var(--ok);background:rgba(76,217,100,.2)}
.opts button.bad{border-color:var(--danger);background:rgba(255,92,92,.18)}
.qin{display:flex;gap:8px;align-items:center}.qin input{flex:1;min-width:0}.qin .u{flex:none;min-width:34px;color:var(--mute);font-size:15px}
.fb{margin-top:10px;font-size:14.5px;line-height:1.45}
.badge{display:inline-block;padding:3px 12px;border-radius:14px;font-weight:700;font-size:14px;border:1px solid var(--line)}
table.tt{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
.tt td,.tt th{padding:6px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.tt th{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tt td.n,.tt th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tt input{min-height:44px;padding:4px 8px;font-size:15px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.dsrow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.dsrow label.f{flex:1 1 140px;margin:0 0 6px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-bottom:8px}
.mgrid label{margin:0}.mgrid span{font-size:11px;color:var(--mute);display:block}
.seg{display:inline-flex;flex:none;border-radius:20px;overflow:hidden;border:1px solid var(--line);max-width:100%}
.seg button{height:40px;min-width:44px;padding:0 12px;background:var(--panel2);font-size:14px;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}.seg button.on{background:var(--accent-bg,#1a6fd4);color:#fff;font-weight:600}
.cols{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:900px){.cols{grid-template-columns:1fr 1fr}}
.hl details,.dt details{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:0 14px}
.hl summary,.dt summary{min-height:48px;display:flex;align-items:center;font-weight:700;font-size:15.5px;cursor:pointer}
.hl .hb2,.dt .hb2{padding:0 0 12px;line-height:1.5;font-size:14.5px}.hl p,.dt p{margin:.4em 0}.hl b{color:var(--accent)}
.hl .eq{font:600 13.5px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;display:block;margin:6px 0;white-space:normal}
.hl table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}.hl td,.hl th{padding:6px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}.hl th{color:var(--mute);font-size:12px}
.pc{color:var(--ok)}.pc.m{color:var(--danger)}
.ld svg{touch-action:manipulation}
.ld .pal{cursor:pointer}.ld .pal rect{fill:var(--accent);fill-opacity:.55;stroke:var(--fg);stroke-width:1.2}.ld .pal text{fill:var(--fg);font-size:22px;text-anchor:middle;pointer-events:none}
.ld .bed{fill:var(--panel);stroke:var(--mute);stroke-width:3}.ld .cab{fill:var(--panel2);stroke:var(--mute);stroke-width:3}.ld .ghost{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:8 6}
.ld .dim{fill:var(--mute);font-size:24px}
.gkp{display:inline-block;min-width:28px;height:28px;border-radius:6px;vertical-align:middle;margin-right:6px}
.hl ul,.dt ul{margin:.3em 0 .3em 1.1em;padding:0}
</style>

</head>
<body>
<!--GATE-->
<script src="gate.js" data-title="Tonfunk Ladungssicherungs-Lab"></script>

<script src="aufgaben.js"></script>
<div id="app">
  <header>
    <button class="ib" id="bMenu" aria-label="Menü"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><a class="ib" id="bHome" href="index.html" aria-label="Startseite" title="Startseite" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none"><svg class="i" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5M6.5 10v9h4v-5h3v5h4v-9"/></svg></a>
    <img id="logo" onclick="location.href='index.html'" title="Startseite" style="cursor:pointer" src="logo.png" alt="Tonfunk" onerror="this.remove()">
    <div class="title" id="title">Ladungssicherungs-Lab</div>
    <button class="hb" id="bTasks" aria-label="Aufgaben">📝 <span>Aufgaben</span></button>
    <button class="hb" id="bExam" aria-label="Prüfmodus" aria-pressed="false">🎓 <span>Prüfmodus</span></button>
    <button class="hb" id="bHelp" aria-label="Hilfe">📘 <span>Hilfe</span></button>
  </header>
  <nav id="tabs" role="tablist"></nav>
  <div id="mid" data-tab="kr">
    <section class="pg scroll" id="pgKr"><div class="wrap" id="krView"></div></section>
    <section class="pg scroll" id="pgLade"><div class="wrap" id="ladeView"></div></section>
    <section class="pg scroll" id="pgStap"><div class="wrap" id="stapView"></div></section>
    <section class="pg scroll" id="pgArt"><div class="wrap" id="artView"></div></section>
    <section class="pg scroll" id="pgGg"><div class="wrap" id="ggView"></div></section>
    <section class="pg scroll" id="pgSym"><div class="wrap" id="symView"></div></section>
    <section class="pg scroll" id="pgVer"><div class="wrap" id="verView"></div></section>
    <section class="pg scroll" id="pgTasks"><div class="wrap" id="taskView"></div></section>
    <section class="pg scroll" id="pgRt"><div class="wrap" id="rtView"></div></section>
    <section class="pg scroll" id="pgBsp"><div class="wrap" id="bspView"></div></section>
    <section class="pg scroll hl" id="pgHelp"><div class="wrap" id="helpView"></div></section>
  </div>
  <div id="pal"></div>
</div>
<div id="toast"></div>
