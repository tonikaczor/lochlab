<style>
#mid[data-tab=rig] #pgRig,#mid[data-tab=curve] #pgCurve,#mid[data-tab=report] #pgReport,#mid[data-tab=design] #pgDesign,#mid[data-tab=calc] #pgCalc,#mid[data-tab=tasks] #pgTasks,#mid[data-tab=help] #pgHelp{display:flex}
#cvw{position:relative;background:var(--cv);overflow:hidden;width:100%;aspect-ratio:1000/560;max-height:56vh;border-radius:12px;border:1px solid var(--line)}
button.bt{display:flex;align-items:center;justify-content:center;width:calc(100% - 20px);margin:6px 10px;min-height:48px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:14px;-webkit-user-select:none;user-select:none;touch-action:none}
button.bt.on,button.bt:active{background:var(--accent-bg,#1a6fd4);border-color:var(--accent-bg,#1a6fd4);color:var(--on-accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;padding:6px 4px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.legend i{display:inline-block;width:14px;height:4px;border-radius:2px}
.sqr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 4px;border-top:1px solid var(--line)}
.sqr .n{width:22px;color:var(--mute);text-align:center;font-size:13px}
.sqr .tb{display:flex;align-items:center;gap:4px}.sqr .tb small,.sqr .vv small{color:var(--mute);white-space:nowrap}.sqr .tIn,.sqr .dIn{width:80px;padding:7px 8px;min-height:40px}
.sqr select{width:auto;min-width:120px;flex:1 1 140px;min-height:40px;padding:7px 8px}
.sqr .vb{flex:1 1 130px;min-width:110px}.sqr .vb select,.sqr .vb input{width:100%;min-height:40px;padding:7px 8px}.sqr .vv{display:flex;align-items:center;gap:5px}
.sqr .ac{margin-left:auto;display:flex;gap:4px}
.sqr .ib2{width:40px;height:40px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:15px;display:inline-grid;place-items:center}
.sqr .ib2[disabled]{opacity:.3}
.sqr.cur{background:rgba(59,158,255,.14)}
.fmb{padding:0 12px 12px}


/* ---- Wechselstrom-Lab: Farben der Gruppen und Sichten (je Theme), Sichtenleiste, Ampelzeile, Bedienpult, Vorher/Nachher ---- */
:root{--g-quelle:#52c4f5;--g-bauteile:#c9a0ff;--g-last:#ff8a5c;--g-ziel:#9aa7b4;--sv-zeit:#52c4f5;--sv-zeiger:#ff8a5c;--sv-formel:#7fd36b;--amp-ok:#4cd964;--amp-warn:#ffb340;--amp-bad:#ff5c5c}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--g-quelle:#0b6f9c;--g-bauteile:#6f3fb0;--g-last:#b8430f;--g-ziel:#566370;--sv-zeit:#0b6f9c;--sv-zeiger:#b8430f;--sv-formel:#1d6f2f;--amp-ok:#1d8a36;--amp-warn:#a85d00;--amp-bad:#c42b2b}}
:root[data-theme=light]{--g-quelle:#0b6f9c;--g-bauteile:#6f3fb0;--g-last:#b8430f;--g-ziel:#566370;--sv-zeit:#0b6f9c;--sv-zeiger:#b8430f;--sv-formel:#1d6f2f;--amp-ok:#1d8a36;--amp-warn:#a85d00;--amp-bad:#c42b2b}
#rigPick{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
#rigPick::-webkit-scrollbar{display:none}
.chip.miss{opacity:.55}
#chainBar{margin:0 0 8px}#chainBar[hidden]{display:none}
.cnrow{display:flex;align-items:stretch;gap:4px}
.cn{flex:1;min-width:0;border:2px solid var(--lc);border-radius:12px;padding:6px 9px;background:var(--panel);display:flex;flex-direction:column;gap:1px}
.cn b{font-size:12.5px;color:var(--lc);display:flex;align-items:center;gap:5px}
.cn span{font-size:12.5px;line-height:1.25;overflow-wrap:anywhere}
.cn small{font-size:12px;color:var(--mute)}
.cn.hot{box-shadow:0 0 0 3px var(--lc) inset}
.lsym{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--lc);color:#111;font-style:normal;font-weight:800;font-size:12px;flex:none}
.amprow{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 0 8px;background:var(--panel)}
.amprow.ok{border-color:var(--amp-ok)}.amprow.warnc{border-color:var(--amp-warn)}.amprow.bad{border-color:var(--amp-bad)}
.asym{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800;background:var(--panel2);border:2px solid currentColor;color:var(--mute)}
.amprow.ok .asym{color:var(--amp-ok)}.amprow.warnc .asym{color:var(--amp-warn)}.amprow.bad .asym{color:var(--amp-bad)}
.atx{min-width:0;display:flex;flex-direction:column}.atx b{font-size:15px}.atx small{color:var(--mute);font-size:12.5px;line-height:1.3}.atx .nt{color:var(--fg);opacity:.85}
.avs{margin-left:auto;display:flex;flex-direction:column;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:600px){.avs{display:none}}
.ctg>summary{color:var(--lc)}
.ct[data-lv]{border-left:0}
.ct .hp{font-weight:400}
.barow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 0}
.hint2.inl{margin:0}
#wipeBar{position:absolute;top:0;bottom:0;left:var(--wp,50%);width:56px;transform:translateX(-50%);cursor:ew-resize;touch-action:none;z-index:3}
#wipeBar[hidden]{display:none}
#qLine{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--mute);padding:2px 2px 6px}
#qLine .qv b{color:var(--fg)}
.chip.fire{background:var(--accent-bg,#1a6fd4);border-color:var(--accent-bg,#1a6fd4);color:var(--on-accent);font-weight:700}
.dk{flex:none;width:16px;text-align:center;font-weight:800}
.ev li.warn .dk{color:var(--warn)}.ev li.error .dk{color:var(--bad-fg)}
.bandbar{display:flex;height:28px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bandbar i{display:grid;place-items:center;font-style:normal;font-weight:800;font-size:14px;color:#111;min-width:14px}
.bd-gruen{background:var(--amp-ok)}.bd-gelb{background:var(--amp-warn)}.bd-rot{background:var(--amp-bad)}.bd-grau{background:var(--mute)}
.wsl-tbl{margin:8px 0;overflow-x:auto;max-width:100%}.wsl-tbl table{border-collapse:collapse;font-size:13.5px;min-width:60%}.wsl-tbl caption{caption-side:top;text-align:left;color:var(--mute);font-size:12px;padding:0 0 3px}.wsl-tbl th,.wsl-tbl td{border:1px solid var(--line);padding:5px 9px;text-align:left}.wsl-tbl th{background:var(--panel2);font-size:12px}
.simband{display:flex;align-items:flex-start;gap:8px;border:2px solid var(--amp-warn);border-radius:12px;padding:6px 6px 6px 12px;margin:0 0 8px;background:var(--panel);font-size:13px;line-height:1.35}
.simband[hidden]{display:none}.simband span{flex:1;min-width:0}.simband .chip{flex:none}
#diceBar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border:2px solid var(--amp-warn);border-radius:12px;padding:6px 10px;margin:0 0 8px;background:var(--panel);font-size:13.5px}
#diceBar[hidden]{display:none}#diceBar b{flex:1 1 180px}
.bdg{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:10px;padding:0 7px;font-size:12px;font-weight:700;white-space:nowrap;vertical-align:middle}
.bdg.ok{color:var(--ok);border-color:var(--ok)}.bdg.uw{color:var(--warn);border-color:var(--warn)}
.lim{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;padding:6px 10px;border-top:1px solid var(--line);font-size:13px}.lim:first-child{border-top:0}.lim small{grid-column:1/-1;color:var(--mute);font-size:12px}
#cvw{touch-action:none}
#meters{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.mt:not(.dg){padding:0}
.mt canvas{width:100%;height:auto;aspect-ratio:13/9;display:block}
.mt:not(.dg) .lbl{text-align:center;padding:0 4px 6px}
.bt.fire{min-height:64px;font-size:18px;background:var(--accent-bg,#1a6fd4);border-color:var(--accent-bg,#1a6fd4);color:var(--on-accent)}
.ctrlchips{padding:2px 0 4px}
.chips .chip{max-width:100%;white-space:normal;height:auto;min-height:40px;padding-top:5px;padding-bottom:5px;line-height:1.2;text-align:left}
@media(max-width:600px){.mt canvas{aspect-ratio:13/8}}
.cnrow{flex-wrap:nowrap}
@media(max-width:600px){.cnrow{flex-direction:column}.cn{padding:6px 8px}.cn b{font-size:13px}}
.wsl-vertiefung>summary{color:var(--fg)}
.wsl-vertiefung canvas{width:100%;height:300px;display:block;background:var(--well);border:1px solid var(--line);border-radius:8px;touch-action:auto}
.wsl-vertiefung .readout{padding:8px 2px 0}
</style>

        <div id="qLine"></div>

        <details class="card wsl-vertiefung" id="cBode" hidden><summary>Vertiefung: Bode-Diagramm <span class="bdg uw" title="Vertiefung: freiwillig, Taste B">Vertiefung</span></summary><div class="cb"><canvas id="bodeCv" role="img" aria-label="Bode-Diagramm des Filters"></canvas><div class="readout" id="bodeTx" aria-live="polite"></div></div></details>
        <details class="card" id="cSweep"><summary>Sweep und Ablauf</summary><div class="cb" id="sweepView"></div></details>
      </div>
      <div id="rigSide">
        <div id="presetBar"></div>
        <div id="ctlHost"></div>
        <details class="card" id="cLim"><summary>Feste Werte und ihr Status</summary><div class="cb" id="limList"></div></details>

        <details class="card" id="cEv" open><summary>Meldungen des Prüfstands</summary><div class="cb"><ul class="ev" id="evList"></ul><div style="padding:4px 6px"><button class="chip s" id="evClr">Liste leeren</button></div></div></details>
      </div>
    </section>
    <section class="pg scroll" id="pgCurve"><div class="wrap" id="curveView"></div></section>
    <section class="pg scroll" id="pgReport"><div class="wrap" id="reportView"></div></section>
    <section class="pg scroll" id="pgDesign"><div class="wrap" id="designView"></div></section>
    <section class="pg scroll" id="pgCalc"><div class="wrap" id="calcView"></div></section>
    <section class="pg scroll" id="pgTasks"><div class="wrap" id="taskView"></div></section>
