<style>
#mid[data-tab=rig] #pgRig,#mid[data-tab=curve] #pgCurve,#mid[data-tab=design] #pgDesign,#mid[data-tab=calc] #pgCalc,#mid[data-tab=tasks] #pgTasks,#mid[data-tab=help] #pgHelp{display:flex}
#presetBar .chip{white-space:normal;height:auto;min-height:40px;padding-top:6px;padding-bottom:6px;text-align:left;line-height:1.2}
.kvs{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;padding:4px 0;min-height:30px}.kvs>span:first-child{color:var(--mute)}
.enr-tbl{margin:8px 0;overflow-x:auto;max-width:100%}.enr-tbl table{border-collapse:collapse;font-size:13.5px;min-width:60%}.enr-tbl caption{caption-side:top;text-align:left;color:var(--mute);font-size:12px;padding:0 0 3px}.enr-tbl th,.enr-tbl td{border:1px solid var(--line);padding:5px 9px;text-align:left}.enr-tbl th{background:var(--panel2);font-size:12px}
.rbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;align-items:center}
.rbar::-webkit-scrollbar{display:none}
.enr-cards{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.enr-cards::-webkit-scrollbar{display:none}
.enr-card{flex:1 0 132px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:56px;padding:8px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left;min-width:0}
.enr-card .ic{font-size:22px;line-height:1}.enr-card b{font-size:13.5px;line-height:1.2}.enr-card small{color:var(--mute);font-size:12px;line-height:1.2}
.enr-card.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
@media(max-width:700px){.enr-card{flex-basis:112px}.enr-card small{display:none}}
#cvw{position:relative;background:var(--cv);overflow:hidden;width:100%;aspect-ratio:1000/640;max-height:62vh;border-radius:12px;border:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;padding:6px 4px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.scope{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px 8px}
.scbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:2px 0 6px}
.scinfo{color:var(--mute);font-size:12.5px;margin-left:auto}
.chartbox{position:relative}
.chartbox canvas{width:100%;height:auto;background:var(--well);border:1px solid var(--line);border-radius:10px;touch-action:none}
.scrub{margin:4px 0 0}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px;margin-top:10px}
.mt .qi{position:absolute;right:6px;top:5px;font-size:12px;color:var(--accent);font-weight:700;width:18px;height:18px;border-radius:9px;border:1px solid var(--accent);display:grid;place-items:center}
.mt .gg{position:relative;height:5px;border-radius:3px;background:var(--well);margin-top:3px;overflow:hidden}.mt .gg i{position:absolute;top:0;bottom:0;left:0;background:var(--accent)}.mt .gg b{position:absolute;top:0;bottom:0;width:2px;background:var(--warn);opacity:.9}
.mt.warn .gg i{background:var(--danger)}
.ct .ctl .lb{display:flex;align-items:center;gap:6px;min-width:0}
.ct .un{color:var(--mute);font-size:12px;min-width:26px}
.ct .seg.wrap{flex-wrap:wrap;border-radius:14px}.ct .seg.wrap button{flex:1 1 30%;border-bottom:1px solid var(--line)}
.rl{display:grid;gap:10px;margin-top:10px}
.fmb{padding:0 12px 12px}
.hl a{display:inline-block;padding:10px 2px}</style>
<link rel="stylesheet" href="design.css">
</head>
<body>

<div id="app">
  <header>
    <button class="ib" id="bMenu" aria-label="Menü"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><a class="ib" id="bHome" href="index.html" aria-label="Startseite" title="Startseite" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none"><svg class="i" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5M6.5 10v9h4v-5h3v5h4v-9"/></svg></a>
    <img id="logo" onclick="location.href='index.html'" title="Startseite" style="cursor:pointer" src="logo.png" alt="Tonfunk" onerror="this.remove()">

    <button class="hb" id="bEx" aria-label="Beispielversuche">📖 <span>Beispiele</span></button>

    <button class="hb" id="bTasks" aria-label="Aufgaben">📝 <span>Aufgaben</span></button>

    <button class="hb" id="bPrint" aria-label="Drucken">🖨 <span>Drucken</span></button>
    <button class="run" id="bRun" aria-label="Start">▶</button>
  </header>
  <nav id="tabs" role="tablist"></nav>
  <div id="taskBar"></div>
  <div id="mid" data-tab="rig">
    <section class="pg rigc" id="pgRig">
      <div id="rigMain">
        <div class="enr-cards" id="rigPick"></div>
        <div class="rbar" id="rigBar"></div>
        <div class="rbar" id="scenBar"></div>
        <div id="cvw"><canvas id="cv" role="img" aria-label="Animation des Prüfstands"></canvas><span id="cvTag"></span><div id="cvFault" role="alert"></div></div>
        <details class="card" id="cLeg"><summary>Legende der Energieflüsse</summary><div class="cb" id="legHost"></div></details>
        <div id="diagHost"></div>
        <div id="scopeHost"></div>
        <div id="meters"></div>
      </div>
      <div id="rigSide">
        <div id="presetBar"></div>
        <div id="ctlHost"></div>
        <details class="card" id="cDiag" open><summary>Hinweise zur Anlage</summary><div class="cb"><ul class="ev" id="diagList"></ul></div></details>
        <details class="card" id="cEv" open><summary>Meldungen des Prüfstands</summary><div class="cb"><ul class="ev" id="evList"></ul><div style="padding:4px 6px"><button class="chip s" id="evClr">Liste leeren</button></div></div></details>
      </div>
    </section>
    <section class="pg scroll" id="pgCurve"><div class="wrap" id="curveView"></div></section>
    <section class="pg scroll" id="pgDesign"><div class="wrap" id="designView"></div></section>
    <section class="pg scroll" id="pgCalc"><div class="wrap" id="calcView"></div></section>
    <section class="pg scroll" id="pgTasks"><div class="wrap" id="taskView"></div></section>
    <section class="pg scroll hl" id="pgHelp"><div class="wrap" id="helpView"></div></section>
  </div>
  <div id="pal"></div>
