<style>

header{display:flex;align-items:center;gap:4px;padding:calc(4px + env(safe-area-inset-top)) 8px 4px;background:var(--panel);border-bottom:1px solid var(--mute);min-height:52px;box-shadow:0 3px 10px rgba(0,0,0,.35);position:relative;z-index:5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

/* ===== Kunststoff-Lab ===== */
#mid[data-tab=stoff] #pgStoff,#mid[data-tab=verf] #pgVerf,#mid[data-tab=gest] #pgGest,#mid[data-tab=mass] #pgMass,#mid[data-tab=verb] #pgVerb,#mid[data-tab=kost] #pgKost,#mid[data-tab=wiss] #pgWiss,#mid[data-tab=tasks] #pgTasks,#mid[data-tab=rt] #pgRt,#mid[data-tab=bsp] #pgBsp,#mid[data-tab=help] #pgHelp{display:flex}

.stats{display:flex;gap:8px;margin:0 0 10px}

.opts{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.opts button{text-align:left;min-height:46px;padding:9px 12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);font-size:14.5px;line-height:1.3}

.qin{display:flex;gap:8px;align-items:center}.qin input{flex:1;min-width:0}.qin .u{flex:none;min-width:34px;color:var(--mute);font-size:15px}
.fb{margin-top:10px;font-size:14.5px;line-height:1.45}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.dsrow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.dsrow label.f{flex:1 1 140px;margin:0 0 6px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-bottom:8px}
.mgrid label{margin:0}.mgrid span{font-size:11px;color:var(--mute);display:block}
.seg{display:inline-flex;flex:none;border-radius:20px;overflow:hidden;border:1px solid var(--line);max-width:100%}
.seg button{height:40px;min-width:44px;padding:0 12px;background:var(--panel2);font-size:14px;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}.seg button.on{background:var(--accent-bg,#1a6fd4);color:#fff;font-weight:600}
.cols{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:900px){.cols{grid-template-columns:1fr 1fr}}
.hl details,.dt details{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:0 14px}
.hl summary,.dt summary{min-height:48px;display:flex;align-items:center;font-weight:700;font-size:15.5px;cursor:pointer}
.hl .hb2,.dt .hb2{padding:0 0 12px;line-height:1.5;font-size:14.5px}.hl p,.dt p{margin:.4em 0}.hl b{color:var(--accent)}
.hl .eq{font:600 13.5px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;display:block;margin:6px 0;white-space:normal}
.hl table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}.hl td,.hl th{padding:6px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}.hl th{color:var(--mute);font-size:12px}
.pc{color:var(--ok)}.pc.m{color:var(--danger)}
.hl ul,.dt ul{margin:.3em 0 .3em 1.1em;padding:0}
/* kun-Zusatz: Bilder und Animationen (Farben nur über Variablen, Bewegung nur ohne prefers-reduced-motion) */
header .title small,.tab .bd,.chip.s,#stat,.card.pl h4,.gh,.lv,.hint2,label.f span,.rdout .st,.stats .bx,.tt th,.mgrid span,.hl table,.hl th,.u{font-size:14px}
.tab .bd{min-width:20px;height:20px}
html:root .btns .btn{flex:1;min-width:120px}
.seg{flex-wrap:wrap;border-radius:14px}.seg button{flex:1 1 auto}
.mgrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.eq2{display:block;font:600 13.5px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:8px 0 0;white-space:normal}
.steps{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14.5px;line-height:1.4}.steps ol{margin:4px 0 0 1.2em;padding:0}
.kvz{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0}
.kvz svg{display:block;width:100%;height:auto;max-height:440px}
.kvz.tkimg svg{max-height:300px}
.kv text{fill:var(--fg);font:14px system-ui,sans-serif;-webkit-user-select:none;user-select:none}
.kv .s{font-size:13px}.kv .m{fill:var(--mute)}.kv .b{font-weight:700;paint-order:stroke;stroke:var(--panel2);stroke-width:3px;stroke-linejoin:round}.kv .mid{text-anchor:middle}.kv .end{text-anchor:end}
.kv .bad{fill:var(--danger)}.kv .warn{fill:var(--warn)}.kv .ok{fill:var(--ok)}.kv .hi{fill:var(--hi)}.kv .nt{fill:#fff}
.kv .box{fill:var(--bg);stroke:var(--line)}.kv .chain{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}.kv .cr{stroke:var(--hi)}
.kv .cryst{fill:var(--work);stroke:var(--hi);stroke-dasharray:4 3}.kv .xl{stroke:var(--danger);stroke-width:2}.kv .xd{fill:var(--danger)}
.kv .ar line{stroke-width:2.2}.kv .arh line{stroke:var(--hi)}.kv .arh polygon{fill:var(--hi)}.kv .arbad line{stroke:var(--danger)}.kv .arbad polygon{fill:var(--danger)}
.kv .arok line{stroke:var(--ok)}.kv .arok polygon{fill:var(--ok)}.kv .arm line{stroke:var(--mute)}.kv .arm polygon{fill:var(--mute)}
.kv .lead,.kv .dim{stroke:var(--mute);stroke-width:1}
.kv .hop,.kv .barrel{fill:var(--panel);stroke:var(--mute)}.kv .screw{fill:var(--mute)}.kv .flight{stroke:var(--panel);stroke-width:2}
.kv .mold{fill:var(--panel);stroke:var(--mute);stroke-width:1.5}.kv .cav{fill:var(--bg)}.kv .core{fill:var(--line);stroke:var(--mute)}.kv .pin{fill:var(--mute)}
.kv .cw{fill:var(--accent);opacity:.45}.kv .melt{fill:var(--hi)}.kv .chipr{fill:var(--panel);stroke:var(--line)}
.kv .pa{fill:var(--accent);fill-opacity:.3;stroke:var(--accent);stroke-width:1.6}.kv .hot{fill:var(--hi);opacity:.55}.kv .scr2{stroke:var(--danger);stroke-width:2}
.kv .mk-bad{fill:none;stroke:var(--danger);stroke-width:2.5}.kv .mk-warn{fill:none;stroke:var(--warn);stroke-width:2.5}.kv .holebg{fill:var(--bg);stroke:var(--mute)}
.kv .nest{fill:none;stroke:var(--mute);stroke-width:1.5;stroke-dasharray:6 4}.kv .band{fill:var(--warn);opacity:.55}
.kv .base{fill:var(--panel);stroke:var(--mute)}.kv .ghost{fill:none;stroke:var(--mute);stroke-dasharray:4 3}
.kv .arm0{fill:var(--accent);fill-opacity:.3;stroke:var(--accent);stroke-width:1.6}.kv .arm-ok{fill:var(--ok);fill-opacity:.35;stroke:var(--ok);stroke-width:1.6}.kv .arm-bad{fill:var(--danger);fill-opacity:.3;stroke:var(--danger);stroke-width:1.6}

/* Spritzgießzyklus: Zustände je Schritt (ph-0 Schließen bis ph-5 Auswerfen) */
.cyc .melt{transform-box:fill-box}.cyc .ms,.cyc .mf{transform-origin:left center}.cyc .mw{transform-origin:center}
.cyc.ph-0 .ms,.cyc.ph-0 .mf{transform:scaleX(0)}.cyc.ph-0 .mw{transform:scaleY(0)}
.cyc.ph-3 .melt,.cyc.ph-4 .melt,.cyc.ph-5 .melt{fill:var(--accent)}
.cyc.ph-4 .mov,.cyc.ph-5 .mov,.cyc.ph-4 .prt{transform:translateX(70px)}
.cyc.ph-5 .prt{transform:translate(40px,70px);opacity:0}
.cyc.ph-5 .ej{transform:translateX(-34px)}
.cyc.ph-1 .scr{transform:translateX(18px)}.cyc.ph-2 .scr{transform:translateX(22px)}
.cyc .pr{opacity:0}.cyc.ph-2 .pr{opacity:1}
.cyc.ph-0 .st0 .chipr,.cyc.ph-1 .st1 .chipr,.cyc.ph-2 .st2 .chipr,.cyc.ph-3 .st3 .chipr,.cyc.ph-4 .st4 .chipr,.cyc.ph-5 .st5 .chipr{fill:var(--accent-bg);stroke:var(--accent-bg)}
.cyc.ph-0 .st0 text,.cyc.ph-1 .st1 text,.cyc.ph-2 .st2 text,.cyc.ph-3 .st3 text,.cyc.ph-4 .st4 text,.cyc.ph-5 .st5 text{fill:#fff;font-weight:700}
@media(prefers-reduced-motion:no-preference){
.cyc.ph-0 .mov{transition:transform .9s ease-in-out}
.cyc.ph-1 .ms{transition:transform .35s linear}.cyc.ph-1 .mw{transition:transform .45s linear .35s}.cyc.ph-1 .mf{transition:transform .6s linear .8s}.cyc.ph-1 .scr{transition:transform 1.2s ease-out}
.cyc.ph-2 .scr{transition:transform .6s}.cyc.ph-2 .pr{transition:opacity .3s}
.cyc.ph-3 .melt{transition:fill 2.4s linear}.cyc.ph-3 .scr{transition:transform 2.4s ease-in-out}.cyc.ph-3 .cw{animation:kCw .8s ease-in-out infinite alternate}
.cyc.ph-4 .mov,.cyc.ph-4 .prt{transition:transform .9s ease-in-out}
.cyc.ph-5 .ej{transition:transform .4s ease-out}.cyc.ph-5 .prt{transition:transform .9s ease-in .3s,opacity .5s linear .9s}.cyc.ph-0 .ej{transition:transform .3s}
@keyframes kCw{from{opacity:.2}to{opacity:.95}}
.kv .ej-ok{animation:kEj 2.8s ease-in-out infinite}.kv .ej-bad{animation:kJig .45s linear infinite}
@keyframes kEj{0%,35%{transform:translateY(0)}55%,80%{transform:translateY(-22px)}100%{transform:translateY(0)}}
@keyframes kJig{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.kv .mk-bad{animation:kPuls 1.1s ease-in-out infinite alternate}@keyframes kPuls{from{stroke-opacity:1}to{stroke-opacity:.25}}
.kv .shr{transform-box:fill-box;transform-origin:0 0;animation:kShr 3.4s ease-out infinite}
@keyframes kShr{0%,8%{transform:scale(var(--k0));fill:var(--hi)}60%,100%{transform:scale(1);fill:var(--accent)}}
.kv .drw{stroke-dasharray:1;animation:kDrw 1.1s ease-out both}@keyframes kDrw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
}
.rcg{display:flex;flex-wrap:wrap;gap:8px}.rc{width:88px;text-align:center;font-size:13px;color:var(--mute)}.rc svg{width:52px;height:48px;display:block;margin:0 auto 2px}
.rctri{fill:none;stroke:var(--ok);stroke-width:3;stroke-linejoin:round}.rcn{fill:var(--fg);font:700 17px system-ui;text-anchor:middle}
