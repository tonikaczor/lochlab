<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pi-Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1f24">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Tonfunk Pi-Lab</title>
<link rel="stylesheet" href="lab.css">
<style>
@media(max-width:1100px){.hb span{display:none}.hb{padding:0 10px}}

main{display:flex;flex-direction:column}
#cvWrap{position:relative;flex:1;min-height:110px}
#dock{height:42%;min-height:230px;max-height:72%;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--panel)}
#dockBar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.btn2{height:32px;padding:0 11px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.btn2:active{background:var(--panel)}.btn2.on{background:var(--accent-bg,#1a6fd4);border-color:var(--accent-bg,#1a6fd4);color:#fff}
#codeStatus{margin-left:auto;font-size:12px;color:var(--mute);max-width:46%;text-align:right}
#dockBody{display:flex;flex:1;min-height:0}
#edWrap{flex:3;display:flex;min-width:0}
#codeGut{margin:0;width:36px;padding:8px 5px 8px 0;text-align:right;color:#6b7683;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;overflow:hidden;white-space:pre;background:var(--bg);border-right:1px solid var(--line)}
#codeTa{flex:1;min-width:0;resize:none;border:0;border-radius:0;background:var(--bg);color:var(--fg);padding:8px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto;tab-size:2}
#serWrap{flex:2;min-width:190px;display:flex;flex-direction:column;border-left:1px solid var(--line)}
#serBar{display:flex;gap:6px;padding:5px 6px;align-items:center;font-size:12px}
#serOut{flex:1;margin:0;padding:6px 8px;overflow:auto;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;background:#0b0f13;color:#cfe8cf;min-height:50px}
#serPlot{position:static;flex:1;width:100%;height:auto;min-height:60px}
#serRow{display:flex;gap:6px;padding:5px 6px;border-top:1px solid var(--line)}
#serRow input{padding:5px 9px;font-size:13px;border-radius:14px}
@media(max-width:900px){#dockBody{flex-direction:column}#serWrap{border-left:0;border-top:1px solid var(--line);flex:1}#dock{height:58%}}
@media(pointer:coarse){#codeTa{font-size:15px}}
@media(max-width:600px){#dock{height:52%;min-height:200px}#dockBar{gap:4px;padding:4px 6px}.btn2{height:30px;padding:0 9px;font-size:12px}#codeStatus{flex-basis:100%;max-width:100%;margin:0;text-align:left}#codeTa,#codeGut{font-size:13px!important}}
@media(max-width:719px){#side{order:-1;flex:none;max-height:34%;border-top:0;border-bottom:1px solid var(--line)}#side.quiet{display:none}#mid>main{min-height:0;overflow:hidden}}

</style>
<link rel="stylesheet" href="design.css">
</head>
<body>
<!--GATE-->
<script src="gate.js" data-title="Tonfunk Pi-Lab"></script>
<!--/GATE-->
<div id="app">
  <header>
    <button class="ib" id="bMenu" aria-label="Menü"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><a class="ib" id="bHome" href="index.html" aria-label="Startseite" title="Startseite" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none"><svg class="i" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5M6.5 10v9h4v-5h3v5h4v-9"/></svg></a>
    <img id="logo" onclick="location.href='index.html'" title="Startseite" style="cursor:pointer" src="logo.png" alt="Tonfunk" onerror="this.remove()">
    <div class="title" id="title">Schaltplan</div>
    <button class="hb" id="bEx" aria-label="Beispielschaltungen">📖 <span>Beispiele</span></button>
    <button class="hb" id="bOpen" aria-label="Gespeicherte Schaltungen">📂 <span>Öffnen</span></button>
    <button class="hb" id="bTasks" style="display:none" aria-label="Aufgaben">📝 <span>Aufgaben</span></button>
    <button class="hb" id="bCab" style="display:none" aria-label="Schaltschrank">🗄 <span>Schrank</span></button>
    <button class="hb" id="bShare" aria-label="Teilen">📤 <span>Teilen</span></button>
    <button class="hb" id="bPrint" aria-label="Drucken">🖨 <span>Drucken</span></button>
    <button class="ib" id="bUndo" aria-label="Rückgängig"><svg class="i" viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 010 10h-3" transform="translate(0 -3)"/></svg></button>
    <button class="ib" id="bRedo" aria-label="Wiederholen"><svg class="i" viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 000 10h3" transform="translate(0 -3)"/></svg></button>
    <button class="run" id="bRun" aria-label="Start">▶</button>
  </header>
  <div id="mid">
    <aside id="parts"></aside>
    <main><div id="cvWrap"><canvas id="cv"></canvas></div>
      <div id="dock">
        <div id="dockBar">
          <button class="btn2" id="cdRun">▶ Start</button><button class="btn2" id="cdStop">■ Stopp</button><button class="btn2" id="cdNew">↻ Neu starten</button>
          <button class="btn2" id="cdEx">📖 Beispiele</button><button class="btn2" id="cdCopy">⧉ Kopieren</button><button class="btn2" id="cdSave">⤓ .py</button>
          <span class="sep"></span><span style="font-size:12px;color:var(--mute)">Tempo</span><button class="btn2" id="cdT1">×1</button><button class="btn2" id="cdT10">×10</button><button class="btn2" id="cdT100">×100</button>
          <span id="codeStatus">Beispiel wählen oder Code schreiben, dann ▶ Start.</span>
        </div>
        <div id="dockBody">
          <div id="edWrap"><pre id="codeGut"></pre><textarea id="codeTa" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Python-Programm"></textarea></div>
          <div id="serWrap">
            <div id="serBar"><button class="btn2" id="serTabT" style="display:none">Text</button><button class="btn2" id="serTabP" style="display:none">Plotter</button><b style="margin-left:6px">Konsole (Ausgabe von print)</b><button class="btn2" id="serClr" style="margin-left:auto">Leeren</button></div>
            <pre id="serOut"></pre><canvas id="serPlot" style="display:none"></canvas>
            <div id="serRow" style="display:none"><input id="serIn"><button class="btn2" id="serSend">Senden</button></div>
          </div>
        </div>
      </div></main>
    <aside id="side"></aside>
  </div>
  <div id="pal"></div>
</div>
<div id="toast"></div>
<div id="printArea"><img id="printImg" alt=""></div>
<script src="ver.js"></script>
<script src="fx.js"></script>
<script src="simics.js"></script>
<script src="simcore.js"></script>
<script src="mcuio.js"></script>
<script src="pyrun.js"></script>
<script>window.LAB='pi';</script>
<script src="beispiele.js"></script>
<script src="pins.js"></script>
<script src="schaltplan.js"></script>
<script src="keys.js"></script>
<script src="rechner.js"></script>
<script src="qr.js"></script>
<script src="auswertung.js"></script>
<script src="panels.js"></script>
<script src="export.js"></script>
<script src="aufgaben.js"></script>
<script src="warum.js"></script>
<script src="denkfragen.js"></script>
<script src="badges.js"></script>
<script src="predict.js"></script>
<script src="speak.js"></script>
<script src="tonwerkstatt.js"></script>
<script src="trainer.js"></script>
<script src="loetuebung.js"></script>
<script src="oszi.js"></script>
<script src="voice.js"></script>
<script src="feel.js"></script>
<script src="kampagne.js"></script>
<script src="duell.js"></script>
<script src="hdr.js"></script>
<script>if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(function(){});</script>
<script src="verbundbar.js" defer></script>
<script src="urheber.js"></script>
<script src="design.js"></script>
</body>
</html>
