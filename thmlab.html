<link rel="stylesheet" href="rig.css">
<style>
#mid[data-tab=rig] #pgRig,#mid[data-tab=cmp] #pgRig,#mid[data-tab=seq] #pgSeq,#mid[data-tab=calc] #pgCalc,#mid[data-tab=tasks] #pgTasks,#mid[data-tab=help] #pgHelp{display:flex}
#mid[data-tab=cmp] .only-rig,#mid[data-tab=rig] .only-cmp{display:none!important}
.kvs{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;padding:4px 0;min-height:30px}.kvs>span:first-child{color:var(--mute)}
.thm-tbl{margin:8px 0;overflow-x:auto;max-width:100%}.thm-tbl table{border-collapse:collapse;font-size:13.5px;min-width:60%}.thm-tbl caption{caption-side:top;text-align:left;color:var(--mute);font-size:12px;padding:0 0 3px}.thm-tbl th,.thm-tbl td{border:1px solid var(--line);padding:5px 9px;text-align:left}.thm-tbl th{background:var(--panel2);font-size:12px}
.rbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;align-items:center}
.rbar::-webkit-scrollbar{display:none}
.thm-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:2px 0 8px}
.thm-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:56px;padding:8px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left;min-width:0}
.thm-card .ic{font-size:22px;line-height:1}.thm-card b{font-size:13.5px;line-height:1.2}.thm-card small{color:var(--mute);font-size:12px;line-height:1.2}
.thm-card.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
@media(max-width:700px){.thm-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.thm-card small{display:none}}
.thm-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:0 0 8px}
#cvw{position:relative;background:var(--cv);overflow:hidden;width:100%;aspect-ratio:1000/560;max-height:56vh;border-radius:12px;border:1px solid var(--line)}
.scope{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px 8px}
.scbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:2px 0 6px}
.scinfo{color:var(--mute);font-size:12.5px;margin-left:auto}
.chartbox{position:relative}
.chartbox canvas{width:100%;height:auto;aspect-ratio:16/8;background:var(--well);border:1px solid var(--line);border-radius:10px;touch-action:none}
.chartbox.sc canvas{aspect-ratio:16/6.5}
.chartbox.lane canvas{aspect-ratio:16/3.4}
.scrub{margin:4px 0 0}
.mt .qi{position:absolute;right:6px;top:5px;font-size:12px;color:var(--accent);font-weight:700;width:18px;height:18px;border-radius:9px;border:1px solid var(--accent);display:grid;place-items:center}
.mt.th{display:flex;align-items:stretch;gap:8px;grid-row:span 2;min-height:120px}.mt.th canvas{width:34px;height:100%;min-height:104px;flex:none}.mt.th>div{min-width:0;display:flex;flex-direction:column;justify-content:center}
.ct .ctl .lb{display:flex;align-items:center;gap:6px;min-width:0}
.ct .un{color:var(--mute);font-size:12px;min-width:26px}
.ct .seg.wrap{flex-wrap:wrap;border-radius:14px}.ct .seg.wrap button{flex:1 1 30%;border-bottom:1px solid var(--line)}
.thm-ic{width:30px;height:30px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--accent)}
.ct.big .ctl{font-size:14px}
button.bt{display:flex;align-items:center;justify-content:center;width:calc(100% - 20px);margin:6px 10px;min-height:48px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:14px;-webkit-user-select:none;user-select:none;touch-action:none}
button.bt.on,button.bt:active{background:var(--accent-bg,#1a6fd4);border-color:var(--accent-bg,#1a6fd4);color:var(--on-accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;padding:6px 4px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.legend i{display:inline-block;width:14px;height:4px;border-radius:2px}.legend i.dotm{width:10px;height:10px;border-radius:50%;background:#ff5c5c}
.thm-cmp .t{font-variant-numeric:tabular-nums}
.thm-bars{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--well);margin:4px 0}.thm-bars i{display:block;height:100%}
.thm-sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sqr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 4px;border-top:1px solid var(--line)}
.sqr .n{width:22px;color:var(--mute);text-align:center;font-size:13px}
.sqr .tb{display:flex;align-items:center;gap:4px}.sqr .tb small,.sqr .vv small{color:var(--mute);white-space:nowrap}.sqr .tIn,.sqr .dIn{width:80px;padding:7px 8px;min-height:40px}
.sqr select{width:auto;min-width:120px;flex:1 1 140px;min-height:40px;padding:7px 8px}
.sqr .vb{flex:1 1 130px;min-width:110px}.sqr .vb select,.sqr .vb input{width:100%;min-height:40px;padding:7px 8px}.sqr .vv{display:flex;align-items:center;gap:5px}
.sqr .ac{margin-left:auto;display:flex;gap:4px}
.sqr .ib2{width:40px;height:40px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:15px;display:inline-grid;place-items:center}
.sqr .ib2[disabled]{opacity:.3}
.sqr.cur{background:rgba(59,158,255,.14)}
#tl{position:relative;height:34px;background:var(--well);border:1px solid var(--line);border-radius:8px;margin:8px 0;overflow:hidden}
#tl i.tk{position:absolute;top:4px;bottom:12px;width:2px;background:var(--warn);opacity:.9}
#tl b.hd{position:absolute;top:0;bottom:0;width:2px;background:var(--ok);box-shadow:0 0 6px var(--ok)}
#tl span.sc{position:absolute;bottom:1px;font-size:10px;color:var(--mute);padding:0 3px;white-space:nowrap}
.rl{display:grid;gap:10px;margin-top:10px}
.fmb{padding:0 12px 12px}
.hl a{display:inline-block;padding:10px 2px}</style>
<link rel="stylesheet" href="design.css">
</head>
<body>
<!--GATE-->

<div id="app">
  <header>
    <button class="ib" id="bMenu" aria-label="Menü"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><a class="ib" id="bHome" href="index.html" aria-label="Startseite" title="Startseite" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none"><svg class="i" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5M6.5 10v9h4v-5h3v5h4v-9"/></svg></a>
    <img id="logo" onclick="location.href='index.html'" title="Startseite" style="cursor:pointer" src="logo.png" alt="Tonfunk" onerror="this.remove()">
    <div class="title" id="title">Thermik-Lab</div>
    <button class="hb" id="bEx" aria-label="Beispielversuche">📖 <span>Beispiele</span></button>
    <button class="hb" id="bOpen" aria-label="Gespeicherte Versuche">📂 <span>Öffnen</span></button>
    <button class="hb" id="bTasks" aria-label="Aufgaben">📝 <span>Aufgaben</span></button>
    <button class="hb" id="bShare" aria-label="Teilen">📤 <span>Teilen</span></button>
    <button class="hb" id="bPrint" aria-label="Drucken">🖨 <span>Drucken</span></button>
    <button class="run" id="bRun" aria-label="Start">▶</button>
  </header>
  <nav id="tabs" role="tablist"></nav>
  <div id="taskBar"></div>
  <div id="mid" data-tab="rig">
    <section class="pg" id="pgRig">
      <div id="rigMain">
        <div class="thm-cards only-rig" id="rigPick"></div>
        <div class="thm-bar" id="rigBar"></div>
        <div id="cvw"><canvas id="cv" aria-label="Animation des Prüfstands"></canvas><span id="cvTag"></span><div id="cvFault" role="alert"></div></div>
        <div id="cmpTop" class="only-cmp"></div>
        <div id="scopeHost"></div>
        <div id="meters"></div>
        <div id="curveHost"></div>
        <div id="cmpBottom" class="only-cmp"></div>
      </div>
      <div id="rigSide">
        <div id="presetBar"></div>
        <div id="ctlHost"></div>
        <details class="card" id="cDiag" open><summary>Hinweise zur Wärmekette</summary><div class="cb"><ul class="ev" id="diagList"></ul></div></details>
        <details class="card" id="cEv" open><summary>Meldungen des Prüfstands</summary><div class="cb"><ul class="ev" id="evList"></ul><div style="padding:4px 6px"><button class="chip s" id="evClr">Liste leeren</button></div></div></details>
      </div>
    </section>
    <section class="pg scroll" id="pgSeq"><div class="wrap" id="seqView"></div></section>
    <section class="pg scroll" id="pgCalc"><div class="wrap" id="calcView"></div></section>
    <section class="pg scroll" id="pgTasks"><div class="wrap" id="taskView"></div></section>
    <section class="pg scroll hl" id="pgHelp"><div class="wrap" id="helpView"></div></section>
  </div>
  <div id="pal"></div>
</div>
<div id="toast"></div>
<div id="printArea"></div>
