<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SchaltLab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1f24">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Tonfunk SchaltLab</title>
<style>
:root{--bg:#14181c;--panel:#222830;--panel2:#2c343e;--fg:#e8ecf0;--mute:#8d99a6;--accent:#3b9eff;--danger:#ff5c5c;--line:#38424d;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.3 -apple-system,system-ui,"Segoe UI",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:4px;padding:calc(4px + env(safe-area-inset-top)) 8px 4px;background:var(--panel);border-bottom:1px solid var(--line);min-height:52px}
header img{height:34px;margin-left:2px}
header .title{flex:1;min-width:0;padding:0 8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
header .title small{display:block;font-weight:400;color:var(--mute);font-size:12px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
.ib{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:20px}
.ib:active,.chip:active{background:var(--panel2)}
.ib[disabled]{opacity:.3}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.run{height:38px;padding:0 16px;border-radius:19px;background:var(--panel2);border:1px solid var(--line);font-weight:600;flex:none}
.run.on{background:#2fae45;border-color:#2fae45;color:#fff}
#mid{display:flex;flex:1;min-height:0}
main{position:relative;flex:1;min-width:0;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#side{width:310px;flex:none;background:var(--panel);border-left:1px solid var(--line);padding:12px;overflow-y:auto;-webkit-user-select:text;user-select:text}
@media(max-width:719px){#mid{flex-direction:column}#side{width:auto;max-height:42%;border-left:0;border-top:1px solid var(--line)}main{min-height:200px}}
#pal{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);min-height:54px;scrollbar-width:thin}
.chip{flex:none;height:38px;padding:0 13px;border-radius:19px;background:var(--panel2);border:1px solid var(--line);font-size:14px;display:inline-flex;align-items:center;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.danger{color:var(--danger)}
.sep{flex:none;width:1px;height:26px;background:var(--line);margin:0 2px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.card h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);font-weight:600}
.card.warn{border-color:#c97a1a}.card.warn ul{margin:0;padding-left:18px;font-size:13px}
.kv{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3px 0;gap:8px}.kv>span:first-child{color:var(--mute)}
.row2{display:flex;gap:8px;align-items:center;margin-bottom:6px}.row2 .btn{flex:1}
.sval{min-width:44px;text-align:center;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger)}
.mini{height:28px;padding:0 8px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:12px;margin-left:3px}.mini.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sl{display:block;margin:8px 0;font-size:13px}.sl span{color:var(--mute);display:flex;justify-content:space-between;margin-bottom:2px}.sl em{font-style:normal;font-weight:600;color:var(--fg)}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;-webkit-user-select:text;user-select:text}
input[type=range]{padding:0;height:34px;border:0;background:none}
label.f{display:block;margin:0 0 10px}label.f span{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
.hint2{color:var(--mute);font-size:13px;margin:6px 0 0}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;padding:9px 16px;border-radius:99px;z-index:300;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:700px){.backdrop{align-items:center}.sheet{border-radius:16px}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 6px 16px;border-bottom:1px solid var(--line);font-size:16px}
.sh-h button{width:40px;height:40px;font-size:18px;color:var(--mute)}
.sh-b{overflow:auto;padding:10px 14px 16px;-webkit-user-select:text;user-select:text}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 6px;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row small{display:block;color:var(--mute)}.row .grow{flex:1;min-width:0}
.btns{display:flex;gap:10px;margin-top:8px}.btns .btn{flex:1}
.help p{margin:.5em 0}.help b{color:var(--accent)}
#gate{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#gate form{width:100%;max-width:340px;text-align:center}
#gate img{width:96px;height:auto;margin-bottom:10px}
#gate h1{margin:0 0 4px;font-size:22px}
#gate p{margin:0 0 18px;color:var(--mute)}
#gate input{text-align:center;margin-bottom:12px}
#gate .btn{width:100%}
#gateErr{margin-top:12px;min-height:20px;color:var(--danger);font-size:14px}
.simsw{display:flex;align-items:center;gap:6px;height:36px;padding:0 8px;margin:0 4px;border-radius:18px;background:#2c343e;border:1px solid #38424d;color:#8d99a6;font-size:12px;flex:none}
.simsw .trk{position:relative;width:38px;height:22px;border-radius:11px;background:#4a5561;transition:background .15s}
.simsw .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.simsw[aria-checked=true] .trk{background:#2fae45}.simsw[aria-checked=true] .knob{left:18px}
.simsw .lL,.simsw .lS{color:#8d99a6}
.simsw[aria-checked=false] .lL,.simsw[aria-checked=true] .lS{color:#fff;font-weight:600}
@media(max-width:560px){.simsw .lL,.simsw .lS{display:none}}
#printArea{display:none}
@media print{#app,.backdrop,#toast,#gate{display:none!important}#printArea{display:block}#printArea img{width:100%;max-height:270mm;object-fit:contain}body{background:#fff}}
.gh{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);padding:14px 6px 4px;font-weight:600}
</style>
</head>
<body>
<!--GATE-->
<div id="gate"><form id="gateForm" autocomplete="on">
  <img src="logo.png" alt="Tonfunk" onerror="this.remove()">
  <h1>Tonfunk SchaltLab</h1>
  <p id="gateHint">Bitte anmelden</p>
  <input id="gateName" type="text" placeholder="Vor- und Nachname" autocomplete="name" autocapitalize="words" autocorrect="off" spellcheck="false" aria-label="Name">
  <input id="gatePw" type="password" placeholder="Passwort" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Passwort">
  <button class="btn pri" type="submit">Öffnen</button>
  <div id="gateErr" role="alert"></div>
</form></div>
<script>
(function(){
  var H='a969a208b4df4a7c43c54c888590813046cf4c30f07efa9bb162c4aff6aabfba';
  var g=document.getElementById('gate');
  var pwOk=false,name='';
  try{pwOk=localStorage.getItem('lm4.gate')===H;name=localStorage.getItem('lm4.name')||'';}catch(e){}
  if(pwOk&&name){g.remove();return;}
  var f=document.getElementById('gateForm'),er=document.getElementById('gateErr'),pw=document.getElementById('gatePw'),nm=document.getElementById('gateName');
  nm.value=name;
  if(pwOk){pw.style.display='none';document.getElementById('gateHint').textContent='Bitte Namen eintragen';}
  async function sha(t){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}
  f.addEventListener('submit',async function(ev){
    ev.preventDefault();
    var n=nm.value.trim().replace(/\s+/g,' ');
    if(n.length<3||n.indexOf(' ')<0){er.textContent='Bitte Vor- und Nachnamen eintragen.';nm.focus();return;}
    if(!pwOk){
      if(!(window.crypto&&crypto.subtle)){er.textContent='Bitte die Seite über https öffnen.';return;}
      if(await sha(pw.value.trim())!==H){er.textContent='Passwort falsch.';pw.select();return;}
      try{localStorage.setItem('lm4.gate',H);}catch(_){}
    }
    try{localStorage.setItem('lm4.name',n);}catch(_){}
    g.remove();
  });
})();
</script>
<!--/GATE-->
<div id="app">
  <header>
    <button class="ib" id="bMenu" aria-label="Menü"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <img id="logo" src="logo.png" alt="Tonfunk" onerror="this.remove()">
    <div class="title" id="title">Schaltplan</div>
    <button class="ib" id="bUndo" aria-label="Rückgängig"><svg class="i" viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 010 10h-3" transform="translate(0 -3)"/></svg></button>
    <button class="ib" id="bRedo" aria-label="Wiederholen"><svg class="i" viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 000 10h3" transform="translate(0 -3)"/></svg></button>
    <button class="run" id="bRun">▶ Start</button>
  </header>
  <div id="mid">
    <main><canvas id="cv"></canvas></main>
    <aside id="side"></aside>
  </div>
  <div id="pal"></div>
</div>
<div id="toast"></div>
<div id="printArea"><img id="printImg" alt=""></div>
<script src="simcore.js"></script>
<script src="schaltplan.js"></script>
<script>if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
