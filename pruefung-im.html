*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:820px;margin:0 auto;padding:22px 18px 60px}header{display:flex;align-items:center;gap:14px;margin-bottom:6px}header img{height:42px}h1{font-size:24px;line-height:1.25;margin:0;overflow-wrap:anywhere}h2{font-size:18px;margin:4px 0 8px}h3{font-size:16px;margin:18px 0 6px;color:var(--mute)}small,.mute{color:var(--mute)}small{font-size:14px}a{color:var(--accent)}
.nav{margin:6px 0 14px;font-size:14px;display:flex;flex-wrap:wrap;align-items:center;gap:0 14px}.nav a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 6px}.nav a.lm-start{padding:0 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-weight:700;text-decoration:none}.weiter{margin-top:18px}
#themeBtn{margin-left:auto;min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:18px;cursor:pointer}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;min-width:0}
.btn{display:inline-block;min-height:44px;margin:6px 8px 6px 0;padding:8px 18px;border-radius:10px;border:1px solid #0a6cdc;background:#0a6cdc;color:#fff;font:600 16px system-ui,sans-serif;cursor:pointer}.btn.zwei,.btn.s{background:transparent;color:var(--fg);border-color:var(--line)}.btn.s{margin:0;padding:6px 12px;font-size:14px}.btn[disabled]{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
.pl{display:flex;flex-direction:column;gap:8px}.zeile{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;text-align:left;cursor:pointer}.zeile:hover{border-color:var(--accent)}.zeile .zi{flex:none;font-size:22px;line-height:1}.zeile .zt{flex:1;min-width:0}.zeile .zt b{display:block;line-height:1.3;overflow-wrap:anywhere}.zeile .zt small{display:block}.zeile .zz{flex:none;max-width:40%;color:var(--mute);font-size:14px;text-align:right}
.hinweis{border-left:4px solid #e0a020;padding:6px 12px;background:var(--panel);border-radius:0 10px 10px 0;margin:12px 0;font-size:14px}
.bar{height:10px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.kl{font-size:14px;margin:6px 0 8px}.kopfz{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px}.kopfz b{min-width:0;overflow-wrap:anywhere}
.fr{font-size:19px;line-height:1.4;margin:6px 0 12px;overflow-wrap:anywhere}
.opt{display:block;width:100%;min-height:48px;text-align:left;margin:6px 0;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--fg);font:inherit;cursor:pointer;overflow-wrap:anywhere}button.opt:hover{border-color:var(--accent)}.opt[aria-checked=true]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}.opt.fest{cursor:default}.opt.ok{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}.opt.no{border-color:var(--no);box-shadow:inset 0 0 0 2px var(--no)}
.rm{display:block;margin:10px 0;padding:8px 12px;border-radius:10px;border:1px solid var(--line);overflow-wrap:anywhere}.rm.ok{border-color:var(--ok)}.rm.no{border-color:var(--no)}.rm.ok>b{color:var(--ok)}.rm.no>b{color:var(--no)}span.rm{display:inline-block}
.numin{min-height:48px;width:min(220px,60%);padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:17px system-ui}.unit{color:var(--mute)}
.rl{padding:8px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}.rl.ok>b{color:var(--ok)}.rl.no>b{color:var(--no)}
.regeln{margin:8px 0;padding-left:20px}.regeln li{margin:4px 0}
.tmr{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5;padding:10px 18px}.tmr span:first-child{min-width:0;overflow-wrap:anywhere}.zeit{flex:none;font:700 20px ui-monospace,Consolas,monospace}.zeit.knapp{color:var(--no)}
.navz{display:flex;justify-content:space-between;gap:8px;margin:12px 0 0}.navz .btn{margin:0}
.nrn{display:flex;flex-wrap:wrap;gap:6px}.nr{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--mute);font:600 15px system-ui;cursor:pointer}.nr.da{background:var(--panel);color:var(--fg);border-color:var(--accent)}.nr.akt{box-shadow:inset 0 0 0 2px var(--accent)}
.pct{font-size:44px;font-weight:700;line-height:1.1;margin:6px 0}.pct.g{color:var(--ok)}.pct.b{color:var(--no)}
table.je{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}table.je th,table.je td{text-align:left;padding:4px 7px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}table.je th{color:var(--mute);font-weight:600}
html.pi-lauf .nav,html.pi-lauf header,html.pi-lauf #intro{display:none}
#verBadge{font-size:14px!important;line-height:20px!important;padding:12px 14px!important;border-radius:10px!important}
@media(max-width:420px){.wrap{padding:16px 12px 50px}.card{padding:14px 12px}.zeile{flex-wrap:wrap}.zeile .zz{flex:1 1 100%;max-width:none;text-align:left}.btn{margin-right:6px}}
@media print{.nav,#themeBtn{display:none!important}body{background:#fff;color:#000}}</style></head>
<script>/* Darstellung: Auto / Hell / Dunkel; Schluessel lm4.theme wie die Startseite (nur der Umschalter schreibt ihn) */
(function(){var K='lm4.theme',de=document.documentElement;
function get(){try{var v=localStorage.getItem(K);return v==='light'||v==='dark'?v:''}catch(e){return ''}}
function set(m){if(m)de.setAttribute('data-theme',m);else de.removeAttribute('data-theme');var b=document.getElementById('themeBtn');if(b)b.setAttribute('aria-label','Darstellung: '+(m==='light'?'hell':m==='dark'?'dunkel':'automatisch nach System')+' (antippen zum Wechseln)');}
set(get());document.addEventListener('DOMContentLoaded',function(){set(get());});
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('#themeBtn');if(!b)return;var c=get(),n=c===''?'light':c==='light'?'dark':'';try{if(n)localStorage.setItem(K,n);else localStorage.removeItem(K);}catch(x){}set(n);});
})();</script>
