<html lang="de">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Tonfunk Pneumatik-Lab</title>
<style>
:root{--bg:#14181c;--panel:#222830;--panel2:#2c343e;--fg:#e8ecf0;--mute:#8d99a6;--accent:#3b9eff;--accent-bg:#1a6fd4;--danger:#ff5c5c;--line:#38424d;--ok:#4cd964;--warn:#ffb340;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.3 -apple-system,system-ui,"Segoe UI",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:4px;padding:calc(4px + env(safe-area-inset-top)) 8px 4px;background:var(--panel);border-bottom:1px solid var(--mute);min-height:52px;box-shadow:0 3px 10px rgba(0,0,0,.35);position:relative;z-index:5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
header img{height:34px;margin-left:2px}
header .title{flex:1;min-width:0;padding:0 8px;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
header .title small{display:block;color:var(--fg);opacity:.78;font-weight:500;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button[disabled]{opacity:.35;cursor:default}
.ib{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:20px}
.ib:active,.chip:active{background:var(--panel2)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hb{height:38px;padding:0 12px;border-radius:19px;background:var(--panel2);border:1px solid var(--mute);font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;margin:0 2px;flex:none}
.hb:active{background:var(--panel)}
@media(max-width:1100px){.hb span{display:none}.hb{padding:0 10px}}
@media(max-width:600px){header img,#bPrint,#bShare,#bOpen,#bEx,#bHome{display:none}}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:7px 10px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:40px;padding:0 15px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font:600 14px system-ui;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tab.on{background:var(--accent-bg,#1a6fd4);border-color:var(--accent-bg,#1a6fd4);color:#fff}
.tab .bd{min-width:18px;height:18px;border-radius:9px;background:#0003;font-size:12px;display:inline-grid;place-items:center;padding:0 5px}
#mid{display:flex;flex:1;min-height:0;position:relative}
.pg{display:none;flex-direction:column;min-width:0;min-height:0;flex:1;overflow:hidden}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:12px 12px 30px}
/* Bedienleiste unten (wie die Werkzeugleiste der anderen Labs). Hinweis Fable-Runde: ungenutzte Regeln der SPS-Vorlage (Editor, Anlage, Simulation) entfernt. */
#pal{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);min-height:54px;scrollbar-width:thin;flex:none}
.chip{flex:none;height:40px;padding:0 13px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font-size:14px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip.on{background:var(--accent-bg,#1a6fd4);border-color:var(--accent-bg,#1a6fd4);color:#fff}
.chip.go{background:#1a7f37;border-color:#1a7f37;color:#fff;font-weight:700}
.chip.danger{color:var(--danger)}.chip.warnc{color:var(--warn);border-color:#c97a1a}.chip.bad{color:#ff8a7a;border-color:#a8433a}
.chip.s{height:34px;padding:0 11px;font-size:13px}
.sep{flex:none;width:1px;height:26px;background:var(--line);margin:0 2px}
.seg{display:inline-flex;flex:none;border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.seg button{height:38px;padding:0 12px;background:var(--panel2);font-size:14px;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}.seg button.on{background:var(--accent-bg,#1a6fd4);color:#fff;font-weight:600}
#stat{flex:none;font-size:12.5px;color:var(--mute);padding:0 4px;white-space:nowrap;font-variant-numeric:tabular-nums}
#stat b{color:var(--fg)}#stat b.run{color:var(--ok);background:none;border:0;padding:0;height:auto}
#taskBar{display:none;align-items:center;gap:8px;padding:6px 10px;background:rgba(59,158,255,.14);border-bottom:1px solid rgba(59,158,255,.45);flex:none}
#taskBar.on{display:flex}#taskBar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0;margin-bottom:10px;overflow:hidden}
.card>summary,.card>h4{list-style:none;margin:0;padding:0 12px;min-height:38px;display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);font-weight:600;cursor:pointer}
.card>summary::-webkit-details-marker{display:none}
.card>summary::after{content:"▾";margin-left:auto;font-size:13px}.card:not([open])>summary::after{content:"▸"}
.card .cb{padding:0 8px 8px}
.card.pl{padding:12px}.card.pl h4{padding:0;margin-bottom:8px}
.card.warn{border-color:#c97a1a}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 6px 6px}
table.iot{width:100%;border-collapse:collapse;font-size:12.5px}.iot td,.iot th{padding:4px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}.iot th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}.iot td.a{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:600;text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--accent-bg,#1a6fd4);border-color:var(--accent-bg,#1a6fd4);color:#fff}.btn.danger{color:var(--danger)}.btn.s{height:36px;padding:0 12px;font-size:13px}
.btns{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.btns .btn{flex:1;min-width:120px}
/* Aufgaben */
.tl{list-style:none;margin:10px 0 0;padding:0;font-size:13.5px}.tl li{padding:5px 0 5px 2px}.tl li.ok{color:var(--ok)}.tl li.bad{color:#ff8a7a}
.tl details{margin:3px 0 2px;color:var(--mute);font-size:12.5px}.tl summary{cursor:pointer;color:var(--accent);min-height:30px;display:flex;align-items:center}
.score{margin-top:8px;font-weight:700;color:#ffb340;font-size:16px}.score.ok{color:var(--ok)}
.gh{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);padding:14px 6px 4px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);min-height:48px;border-radius:0}.row:last-child{border:0}.row:active{background:var(--panel2)}
.row small{display:block;color:var(--mute);margin-top:1px}.row .grow{flex:1;min-width:0}
.dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px}.dot.g{background:var(--ok);border-color:var(--ok);color:#06210d}.dot.p{border-color:var(--warn);color:var(--warn);font-size:10px;font-weight:700}
.lv{color:var(--warn);letter-spacing:1px;font-size:12px}
.hint2{color:var(--mute);font-size:13px;margin:6px 0 0;line-height:1.4}
.big{font-size:20px;font-weight:700;margin:0 0 6px}
/* Hilfe */
.hl details{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:0 14px}.hl summary{min-height:48px;display:flex;align-items:center;font-weight:700;font-size:15.5px;cursor:pointer}
.hl .hb2{padding:0 0 12px;line-height:1.5;font-size:14.5px}.hl p{margin:.4em 0}.hl b{color:var(--accent)}.hl code,.code{font:600 12.5px ui-monospace,Menlo,Consolas,monospace;background:#10151a;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.hl table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}.hl td,.hl th{padding:6px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}.hl th{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.hl .tryit{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* Fenster, Meldungen */
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;-webkit-user-select:text;user-select:text}
textarea{font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
label.f{display:block;margin:0 0 10px}label.f span{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;padding:9px 16px;border-radius:99px;z-index:300;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:700px){.backdrop{align-items:center}.sheet{border-radius:16px}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 6px 16px;border-bottom:1px solid var(--line);font-size:16px}
.sh-h button{width:40px;height:40px;font-size:18px;color:var(--mute)}
.sh-b{overflow:auto;padding:10px 14px 16px;-webkit-user-select:text;user-select:text}
#gate{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#gate form{width:100%;max-width:340px;text-align:center}
#gate img{width:96px;height:auto;margin-bottom:10px}
#gate h1{margin:0 0 4px;font-size:22px}
#gate p{margin:0 0 18px;color:var(--mute)}
#gate input{text-align:center;margin-bottom:12px}
#gate .btn{width:100%}
#gateErr{margin-top:12px;min-height:20px;color:var(--danger);font-size:14px}
#printArea{display:none}
#printArea .proto{font:13px/1.4 Arial,sans-serif;color:#000;background:#fff}#printArea h1{font-size:22px;margin:0 0 8px}#printArea h2{font-size:15px;margin:14px 0 4px}#printArea table{border-collapse:collapse;width:100%;margin:6px 0}#printArea td,#printArea th{border:1px solid #444;padding:4px 7px;text-align:left}#printArea pre{font:12px/1.35 Consolas,monospace;white-space:pre-wrap;border:1px solid #888;padding:8px}#printArea img{max-width:100%;max-height:120mm;object-fit:contain;border:1px solid #888;background:#14181c}
@media print{#app,.backdrop,#toast,#gate,#verBadge{display:none!important}#printArea{display:block}body{background:#fff;height:auto}html{height:auto}}
.fbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.fbar .chip{height:34px;padding:0 11px;font-size:13px}
.qin{display:flex;gap:8px;align-items:center}
.qin input{flex:1;min-width:0}
.qin .u{flex:none;min-width:44px;color:var(--mute);font-size:15px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;min-height:46px;padding:9px 12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);font-size:14.5px;line-height:1.3}
.opts button.on{border-color:var(--accent);background:rgba(59,158,255,.2)}
.opts button.ok{border-color:var(--ok);background:rgba(76,217,100,.2)}
.opts button.bad{border-color:#ff5c5c;background:rgba(255,92,92,.18)}
.opts button[disabled]{opacity:1}
.vt{list-style:none;margin:8px 0 0;padding:0;font-size:13.5px}
.vt li{padding:6px 0;border-top:1px solid var(--line);display:flex;gap:8px}
.vt li:first-child{border-top:0}
.vt li .m{flex:none;width:20px;text-align:center;font-weight:700}
.vt li.ok .m{color:var(--ok)}.vt li.bad .m{color:#ff8a7a}.vt li.nn .m{color:var(--mute)}
.vt li small{display:block;color:var(--mute);font-size:12px}
.dsrow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.dsrow label.f{flex:1 1 150px;margin:0 0 6px}
.mark-i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--warn);margin-right:6px}
.stbar{height:8px;background:#0006;border-radius:4px;overflow:hidden;margin:6px 0}.stbar i{display:block;height:100%;background:var(--ok)}
/* ===== Pneumatik-Lab ===== */
:root{--ink:#e8ecf0;--air:#3aa0ff;--nil:#7b8794;--hi:rgba(59,158,255,.22);--boxf:#1b2128;--air-f:rgba(58,160,255,.28)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f1f4f7;--panel:#fff;--panel2:#e8edf2;--fg:#17202a;--mute:#566370;--accent:#0b62c4;--accent-bg:#0b62c4;--danger:#c42b2b;--line:#c5ced8;--ok:#1d8a36;--warn:#a85d00;--ink:#17202a;--air:#0b72e0;--nil:#8a949e;--hi:rgba(11,98,196,.16);--boxf:#f7f9fb;--air-f:rgba(11,114,224,.22);color-scheme:light}}
:root[data-theme=light]{--bg:#f1f4f7;--panel:#fff;--panel2:#e8edf2;--fg:#17202a;--mute:#566370;--accent:#0b62c4;--accent-bg:#0b62c4;--danger:#c42b2b;--line:#c5ced8;--ok:#1d8a36;--warn:#a85d00;--ink:#17202a;--air:#0b72e0;--nil:#8a949e;--hi:rgba(11,98,196,.16);--boxf:#f7f9fb;--air-f:rgba(11,114,224,.22);color-scheme:light}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]) header{box-shadow:0 2px 8px rgba(0,0,0,.12)}:root:not([data-theme=dark]) .hl code,:root:not([data-theme=dark]) .code,:root:not([data-theme=dark]) .pk-req span{background:#e8edf2}:root:not([data-theme=dark]) .wh{background:#e8edf2}}
:root[data-theme=light] header{box-shadow:0 2px 8px rgba(0,0,0,.12)}
:root[data-theme=light] .hl code,:root[data-theme=light] .code{background:#e8edf2}
#mid[data-tab=sym] #pgSym,#mid[data-tab=anl] #pgAnl,#mid[data-tab=aufg] #pgTasks,#mid[data-tab=rech] #pgCalc,#mid[data-tab=trn] #pgTrn,#mid[data-tab=help] #pgHelp{display:flex}
#mid[data-tab=bsp] #pgBsp{display:flex}
svg.sym{display:block;margin:0 auto}
.ln{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ln.air{stroke:var(--air);stroke-width:2.6}.ln.nil{stroke:var(--nil)}.ln.ac{stroke:var(--accent);stroke-width:2.6}
.fl{fill:var(--ink);stroke:none}.fl.air{fill:var(--air)}.fl.ac{fill:var(--accent)}.fl.nil{fill:var(--nil)}
.bx{fill:var(--boxf);stroke:var(--ink);stroke-width:1.8}.bx.on{fill:var(--hi);stroke:var(--accent);stroke-width:2.4}.bx.cy{fill:none;stroke-width:2.2}
.air-f{fill:var(--air-f)}
.tx{fill:var(--ink);font:600 11px system-ui,sans-serif}.tx.m{fill:var(--mute)}.tx.lab{font-weight:800;font-size:13px}.tx.pn{fill:var(--mute);font-size:11px}
.hose{fill:none;stroke-width:3.4;stroke-linejoin:round;stroke-linecap:round}.hose.air{stroke:var(--air)}.hose.nil{stroke:var(--nil)}.hose.fx{opacity:.92}.hose.del{stroke-dasharray:6 4;filter:drop-shadow(0 0 2px var(--danger))}
.pdot{fill:var(--panel);stroke:var(--accent);stroke-width:2}.pdot.used{fill:var(--accent)}.pdot.sel{fill:var(--warn);stroke:var(--warn);stroke-width:3}
.tapport .hit{fill:transparent;cursor:pointer}.tapport .pd{fill:var(--panel);stroke:var(--accent);stroke-width:2}.tapport.on .pd{fill:var(--warn);stroke:var(--warn)}
#plHost{overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
#plHost svg{display:block;margin:0 auto}
.plstat{font-size:13.5px;color:var(--mute);margin:8px 2px 10px;line-height:1.4}.plstat b{color:var(--fg)}.plstat .wn{color:var(--warn);font-weight:700}
.cirsel{padding:0 0 8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}.cirsel .chip{flex:none}
.taskhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}.taskhead b{flex:1;min-width:0;font-size:15px}
.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.symcard{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;text-align:center;padding:10px 6px;border-radius:12px;background:var(--panel);border:1px solid var(--line);min-height:112px;font-size:13px}
.symcard svg{max-height:70px;width:auto!important;max-width:100%}.symcard:active{background:var(--panel2)}
.symbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;text-align:center;overflow:auto}
.symrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0}
.tp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.tph b{font-size:16px}.tph small{display:block;color:var(--mute);margin-top:2px;font-size:12px}.tpt{margin:8px 0;line-height:1.45}
.okb{color:var(--ok);font-weight:700;font-size:13px}
.res{border-radius:10px;padding:9px 12px;margin-top:10px;line-height:1.45;font-size:14px}.res.ok{background:rgba(76,217,100,.16);border:1px solid var(--ok)}.res.bad{background:rgba(255,179,64,.14);border:1px solid var(--warn)}
.steps{margin:8px 0 0;padding-left:20px;font-size:13.5px;line-height:1.5}
.modebar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
.calcout{margin-top:4px}.calcout .iot td{padding:6px}.calcout .iot td.a{text-align:right}
.hb2{padding:0 0 12px;line-height:1.5;font-size:14.5px}
.hl .hb2 ol{padding-left:20px}
#pgSym,#pgAnl,#pgTrn{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#plHost svg text{user-select:none;-webkit-user-select:none}
.fbar .chip,.fbar{flex-wrap:wrap}
@media(max-width:600px){#stat{display:none}.tab{height:38px;padding:0 12px}}
@media(max-width:380px){.wrap{padding:10px 10px 24px}}

</style>
