<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Regelungstechnik-Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1f24">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Tonfunk Regelungstechnik-Lab</title>
<style>
:root{--bg:#14181c;--panel:#222830;--panel2:#2c343e;--fg:#e8ecf0;--mute:#8d99a6;--accent:#3b9eff;--danger:#ff5c5c;--line:#38424d;--ok:#4cd964;--warn:#ffb340;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.3 -apple-system,system-ui,"Segoe UI",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:4px;padding:calc(4px + env(safe-area-inset-top)) 8px 4px;background:var(--panel);border-bottom:1px solid var(--mute);min-height:52px;box-shadow:0 3px 10px rgba(0,0,0,.35);position:relative;z-index:5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
header img{height:34px;margin-left:2px}
header .title{flex:1;min-width:0;padding:0 8px;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
header .title small{display:block;color:var(--fg);opacity:.78;font-weight:500;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button[disabled]{opacity:.35;cursor:default}
.ib{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:20px}
.ib:active,.chip:active{background:var(--panel2)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hb{height:40px;padding:0 12px;border-radius:20px;background:var(--panel2);border:1px solid var(--mute);font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;margin:0 2px;flex:none}
.hb:active{background:var(--panel)}
@media(max-width:1100px){.hb span{display:none}.hb{padding:0 10px}}
.run{height:40px;padding:0 16px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font-weight:600;flex:none}
.run.on{background:#2fae45;border-color:#2fae45;color:#fff}
@media(max-width:600px){header img,#bPrint,#bShare,#bOpen,#bEx,#bHome{display:none}}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:7px 10px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:40px;padding:0 15px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font:600 14px system-ui;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab .bd{min-width:18px;height:18px;border-radius:9px;background:#0003;font-size:11px;display:inline-grid;place-items:center;padding:0 5px}
#taskBar{display:none;align-items:center;gap:8px;padding:6px 10px;background:rgba(59,158,255,.14);border-bottom:1px solid rgba(59,158,255,.45);flex:none}
#taskBar.on{display:flex}#taskBar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
#mid{display:flex;flex:1;min-height:0;position:relative}
.pg{display:none;flex-direction:column;min-width:0;min-height:0;flex:1;overflow:hidden}
#mid[data-tab=rig] #pgRig,#mid[data-tab=meas] #pgMeas,#mid[data-tab=tune] #pgTune,#mid[data-tab=seq] #pgSeq,#mid[data-tab=calc] #pgCalc,#mid[data-tab=tasks] #pgTasks,#mid[data-tab=help] #pgHelp{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:12px 12px 30px}
#pal{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);min-height:54px;scrollbar-width:thin;flex:none}
.chip{flex:none;height:40px;min-width:40px;justify-content:center;padding:0 13px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font-size:14px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.go{background:#2fae45;border-color:#2fae45;color:#fff;font-weight:700}
.chip.danger{color:var(--danger)}
.chip.s{height:40px;padding:0 11px;font-size:13px}
.sep{flex:none;width:1px;height:26px;background:var(--line);margin:0 2px}
.seg{display:inline-flex;flex:none;border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.seg button{min-height:40px;min-width:40px;padding:0 12px;background:var(--panel2);font-size:14px;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}.seg button.on{background:var(--accent);color:#fff;font-weight:600}
#stat{flex:none;font-size:12.5px;color:var(--mute);padding:0 4px;white-space:nowrap;font-variant-numeric:tabular-nums}
#stat b{color:var(--fg)}
/* Karten und Listen */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0;margin-bottom:10px;overflow:hidden}
.card>summary,.card>h4{list-style:none;margin:0;padding:0 12px;min-height:40px;display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);font-weight:600;cursor:pointer}
.card>summary::-webkit-details-marker{display:none}
.card>summary::after{content:"▾";margin-left:auto;font-size:13px}.card:not([open])>summary::after{content:"▸"}
.card .cb{padding:0 8px 8px}
.card.pl{padding:12px}.card.pl h4{padding:0;margin-bottom:8px;cursor:default}
.ev{list-style:none;margin:0;padding:0 6px;font-size:12.5px;max-height:220px;overflow-y:auto}.ev li{padding:5px 2px;border-top:1px solid var(--line);display:flex;gap:8px}.ev li:first-child{border-top:0}.ev time{flex:none;color:var(--mute);font-variant-numeric:tabular-nums}.ev li.warn{color:var(--warn)}.ev li.error{color:#ff8a7a}.ev li.empty{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 6px 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:600;text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger)}
.btns{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.btns .btn{flex:1;min-width:120px}
.gh{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);padding:14px 6px 4px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);min-height:48px;border-radius:0}.row:last-child{border:0}.row:active{background:var(--panel2)}
.row small{display:block;color:var(--mute);margin-top:1px}.row .grow{flex:1;min-width:0}
.dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px}.dot.g{background:var(--ok);border-color:var(--ok);color:#06210d}.dot.p{border-color:var(--warn);color:var(--warn);font-size:10px;font-weight:700}
.lv{color:var(--warn);letter-spacing:1px;font-size:11px}
.hint2{color:var(--mute);font-size:13px;margin:6px 0 0;line-height:1.4}
.big{font-size:20px;font-weight:700;margin:0 0 6px}
.ph2{padding:26px 16px;text-align:center;color:var(--mute)}.ph2 b{display:block;color:var(--fg);font-size:17px;margin-bottom:6px}.ph2 .btn{margin-top:12px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;-webkit-user-select:text;user-select:text}
input[type=checkbox],input[type=radio]{width:22px;height:22px;flex:none;padding:0;accent-color:var(--accent)}
textarea{font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
label.f{display:block;margin:0 0 10px}label.f span{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
label.f.auto input{background:rgba(255,213,79,.16);border-color:#c9a227}
.auto-key{display:inline-block;width:12px;height:12px;border-radius:3px;background:rgba(255,213,79,.5);vertical-align:-1px}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;font-size:13.5px;margin:4px 0}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 10px}
.frm label.f,.frm .f{margin:0}
.res{background:#10151a;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.res .big2{font-size:21px;font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums}
.res ol,.ex ol{margin:8px 0 0;padding-left:20px;color:var(--mute);font-size:13.5px;line-height:1.5}
.kvs{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;padding:4px 0;min-height:30px}.kvs>span:first-child{color:var(--mute)}
.ex{border-left:3px solid var(--accent);padding:6px 12px;background:#10151a;border-radius:0 8px 8px 0;margin:8px 0}
.ex.ok{border-color:var(--ok)}.ex.bad{border-color:#ff5c5c}
.readout{font-size:13px;padding:4px 6px;color:var(--fg);font-variant-numeric:tabular-nums;min-height:22px}
table.kt,table.iot{width:100%;border-collapse:collapse;font-size:13.5px}
.kt td,.kt th,.iot td,.iot th{padding:5px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}.kt th,.iot th{color:var(--mute);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-top:0}
.iot.cmp td:nth-child(n+2){font-variant-numeric:tabular-nums}
.amp{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700;border:1px solid var(--line)}
.amp.ok{color:var(--ok);border-color:var(--ok)}.amp.warnc{color:var(--warn);border-color:#c97a1a}.amp.bad{color:#ff8a7a;border-color:#a8433a}
.pbar{height:7px;border-radius:4px;background:#0006;overflow:hidden;min-width:60px;flex:1;margin:4px 0}.pbar.big{height:12px;border-radius:6px}.pbar i{display:block;height:100%;background:var(--accent);transition:width .1s}
/* Aufgaben */
.tl{list-style:none;margin:10px 0 0;padding:0;font-size:13.5px}.tl li{padding:5px 0 5px 2px}.tl li.ok{color:var(--ok)}.tl li.bad{color:#ff8a7a}
.tl details{margin:3px 0 2px;color:var(--mute);font-size:12.5px}.tl summary{cursor:pointer;color:var(--accent);min-height:40px;display:flex;align-items:center}
.score{margin-top:8px;font-weight:700;color:#ffb340;font-size:16px}.score.ok{color:var(--ok)}
.sheetbox{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}
fieldset.choice{border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:6px 10px}fieldset.choice legend{padding:0 6px;font-size:13px;color:var(--mute)}
.opt{display:flex;align-items:center;gap:10px;min-height:40px}
/* Prüfstand */
#pgRig{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#rigMain,#rigSide{min-width:0}
#rigMain{padding:8px 10px 4px}
#rigSide{padding:0 10px 16px}
@media(min-width:900px){
  #pgRig{flex-direction:row;overflow:hidden}
  #rigMain{flex:1;overflow-y:auto;padding-bottom:16px}
  #rigSide{flex:none;width:370px;overflow-y:auto;border-left:1px solid var(--line);padding-top:8px}
}
.rbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;align-items:center}
.rbar::-webkit-scrollbar{display:none}
#cvw{position:relative;background:#14181c;overflow:hidden;width:100%;aspect-ratio:1000/560;max-height:56vh;border-radius:12px;border:1px solid var(--line)}
/* Anlage, Messgeräte, Schreiber: alles grob auf einer Seite. Breite folgt der Höhengrenze (--ar setzt regui.js aus der Weltgröße). */
@media(min-width:900px){#cvw{width:min(100%,calc(32vh*var(--ar,1.78)));max-height:32vh;margin:0 auto}}
canvas{display:block;touch-action:none}
#cvw canvas{position:absolute;inset:0;width:100%;height:100%}
#cvTag{position:absolute;right:8px;bottom:8px;font-size:12px;font-weight:600;background:#000a;border:1px solid var(--line);border-radius:12px;padding:3px 9px;pointer-events:none;color:var(--mute);max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:2}
#cvFault{position:absolute;left:8px;right:8px;bottom:8px;z-index:2;font-size:13.5px;font-weight:700;background:#7a1d1dee;border:1px solid #ff5c5c;border-radius:10px;padding:6px 10px;display:none;pointer-events:none}
#cvFault.on{display:block}
.scope{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px 8px}
.scbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:2px 0 6px}
.scinfo{color:var(--mute);font-size:12.5px;margin-left:auto}
.chartbox{position:relative}
.chartbox canvas{width:100%;height:auto;aspect-ratio:16/8;background:#10151a;border:1px solid var(--line);border-radius:10px;touch-action:none}
.chartbox.sc canvas{aspect-ratio:16/6.5}
.chartbox.lane canvas{aspect-ratio:16/3.4}
.scope .chartbox.sc canvas{aspect-ratio:auto;height:150px}
.scope .chartbox.lane canvas{aspect-ratio:auto;height:112px}
.scope .scrub{display:flex;align-items:center;gap:10px;margin:2px 0 0}.scope .scrub span{flex:0 1 38%;margin:0;font-size:11px;line-height:1.25}.scope .scrub input{flex:1;min-width:0;margin:0}
.scope .scbar{padding:0 0 6px}.scope .readout{min-height:20px;padding:2px 6px}
@media(min-width:900px){#rigMain .scope{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}#rigMain .scope .scbar,#rigMain .scope .scrub,#rigMain .scope .readout{grid-column:1/-1}#rigMain .scope .chartbox.sc canvas,#rigMain .scope .chartbox.lane canvas{height:140px}}
@media(max-width:600px){.scope .chartbox.sc canvas{height:132px}.scope .chartbox.lane canvas{height:104px}.scope .scrub{display:block}.scope .scrub span{margin-bottom:0}}
.chartbox.sq canvas{aspect-ratio:1/1;max-width:440px;margin:6px auto 0}
.scrub{margin:4px 0 0}
input[type=range]{height:40px;padding:0;border:0;background:none;accent-color:var(--accent);-webkit-appearance:auto;appearance:auto;margin:2px 0 0}
#meters{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;margin-top:8px}
.mt{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;min-height:48px}
.mt canvas{width:100%;height:auto;aspect-ratio:13/9}.mt .lbl{font-size:11px;color:var(--mute);text-align:center;padding:0 4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt.dg{padding:6px 10px}.mt.dg .lbl{font-size:11.5px;text-align:left;padding:0}.mt.dg .num{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.mt.dg .num small{font-size:12px;color:var(--mute);font-weight:500;margin-left:3px}
.mt.dg.warn .num{color:#ff8a7a}
.mt.warn{border-color:#ff5c5c}
@media(min-width:700px){#meters{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:4px}}
@media(max-width:600px){#meters{grid-template-columns:repeat(3,1fr);gap:5px}.mt canvas{aspect-ratio:13/8}.mt .lbl{font-size:11px}}
.ctg{margin-bottom:10px}
.ct{display:block;padding:4px 10px;min-height:44px}
.ct[hidden]{display:none}
.ct+.ct{border-top:1px solid var(--line)}
.ct .ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600}
.ct .vi{display:flex;align-items:center;gap:4px;color:var(--accent)}
.ct .num{width:92px;min-height:40px;padding:5px 8px;text-align:right;font-size:15px;font-variant-numeric:tabular-nums}
.ct .un{color:var(--mute);font-size:12px;min-width:26px}
.ct small.hp{display:block;color:var(--mute);font-size:11.5px;line-height:1.3;margin-top:1px}
.ct.p0{padding:0}
.ct .seg{display:flex;width:100%;margin-top:4px}.ct .seg button{flex:1;min-height:40px;padding:4px 6px;white-space:normal;line-height:1.15}
.ct .chips{padding:4px 0}
.ct.modect .seg button{min-height:46px;font-weight:700}
.ct select{margin-top:4px;padding:7px 10px;min-height:40px}
button.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;min-height:48px;padding:4px 10px}
button.sw .lab{font-size:13.5px;font-weight:600;min-width:0}
button.sw .tgl{flex:none;width:58px;height:32px;border-radius:16px;background:#3a434d;border:1px solid #0008;position:relative;transition:background .12s}
button.sw .tgl i{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#cfd6dd;box-shadow:0 2px 4px #0008;transition:left .12s}
button.sw[aria-checked=true] .tgl{background:#2fae45}
button.sw[aria-checked=true] .tgl i{left:29px;background:#fff}
button.sw:active{background:var(--panel2)}
button.bt{display:flex;align-items:center;justify-content:center;width:calc(100% - 20px);margin:6px 10px;min-height:48px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:14px;-webkit-user-select:none;user-select:none;touch-action:none}
button.bt.on,button.bt:active{background:var(--accent);border-color:var(--accent);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;padding:6px 4px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.legend i{display:inline-block;width:14px;height:4px;border-radius:2px}.legend i.dotm{width:10px;height:10px;border-radius:50%;background:#ff5c5c}
/* Strecke messen */
.steps{list-style:none;margin:0;padding:0;counter-reset:st}
.steps li{counter-increment:st;position:relative;margin:0 0 8px;padding:10px 10px 10px 44px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.steps li::before{content:counter(st);position:absolute;left:10px;top:10px;width:26px;height:26px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;font-weight:700;font-size:13px}
.steps li.cur{border-color:var(--accent)}.steps li.cur::before{border-color:var(--accent);color:var(--accent)}
.steps li.done{border-color:var(--ok)}.steps li.done::before{content:"✓";border-color:var(--ok);background:var(--ok);color:#06210d}
.sdesc{display:block;color:var(--mute);font-size:12.5px;margin:2px 0 6px}
.srow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.srow .f{flex:1 1 130px;margin:0}.srow .btn{flex:1 1 170px}
.rbar#mCrvSel{padding-top:6px}
/* Einstellhilfe und Kenngrößen */
summary.lnk{cursor:pointer;color:var(--accent);min-height:40px;display:flex;align-items:center}
#tStab .cb{padding:6px 12px 12px}
/* Ablauf */
.sqr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 4px;border-top:1px solid var(--line)}
.sqr .n{width:22px;color:var(--mute);text-align:center;font-size:13px}
.sqr .tb{display:flex;align-items:center;gap:4px}.sqr .tb small,.sqr .vv small{color:var(--mute);white-space:nowrap}.sqr .tIn,.sqr .dIn{width:80px;padding:7px 8px;min-height:40px}
.sqr select{width:auto;min-width:120px;flex:1 1 140px;min-height:40px;padding:7px 8px}
.sqr .vb{flex:1 1 130px;min-width:110px}.sqr .vb select,.sqr .vb input{width:100%;min-height:40px;padding:7px 8px}.sqr .vv{display:flex;align-items:center;gap:5px}
.sqr .ac{margin-left:auto;display:flex;gap:4px}
.sqr .ib2{width:40px;height:40px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:15px;display:inline-grid;place-items:center}
.sqr .ib2[disabled]{opacity:.3}
.sqr.cur{background:rgba(59,158,255,.14)}
#tl{position:relative;height:34px;background:#10151a;border:1px solid var(--line);border-radius:8px;margin:8px 0;overflow:hidden}
#tl i.tk{position:absolute;top:4px;bottom:12px;width:2px;background:var(--warn);opacity:.9}
#tl b.hd{position:absolute;top:0;bottom:0;width:2px;background:var(--ok);box-shadow:0 0 6px var(--ok)}
#tl span.sc{position:absolute;bottom:1px;font-size:10px;color:var(--mute);padding:0 3px;white-space:nowrap}
/* Rechnen */
.rl{display:grid;gap:10px;margin-top:10px}
.rm{background:#10151a;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.rc{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}.rc b{color:var(--accent)}.rc.no{color:var(--mute)}
@media(max-width:480px){.rg{grid-template-columns:1fr}}
details.fm{border:1px solid var(--line);border-radius:10px;margin:6px 0;background:var(--panel2)}
details.fm>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;padding:0 12px;font-weight:600;font-size:14px}
.fmb{padding:0 12px 12px}
.exw{margin-top:6px}
/* Lernen */
.hl details{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:0 14px}.hl summary{min-height:48px;display:flex;align-items:center;font-weight:700;font-size:15.5px;cursor:pointer}
.hl .hb2{padding:0 0 12px;line-height:1.5;font-size:14.5px}.hl p{margin:.4em 0}.hl b{color:var(--accent)}.hl code{font:600 12.5px ui-monospace,Menlo,Consolas,monospace;background:#10151a;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.hl table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse;font-size:13.5px;margin:6px 0}.hl a{display:inline-block;padding:10px 2px}.hl td,.hl th{padding:6px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}.hl th{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
svg.dr{background:#10151a;border:1px solid var(--line);border-radius:8px;display:block;margin:8px 0;width:100%;max-width:460px;height:auto}
.fig{margin:6px 0}.fig>b{display:block;color:var(--fg)!important;font-size:13px}
.hl .tryit{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* Fenster, Meldungen */
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;padding:9px 16px;border-radius:99px;z-index:300;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:700px){.backdrop{align-items:center}.sheet{border-radius:16px}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 6px 16px;border-bottom:1px solid var(--line);font-size:16px}
.sh-h button{width:40px;height:40px;font-size:18px;color:var(--mute)}
.sh-b{overflow:auto;padding:10px 14px 16px;-webkit-user-select:text;user-select:text}
#gate{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#gate form{width:100%;max-width:340px;text-align:center}
#gate img{width:96px;height:auto;margin-bottom:10px}
#gate h1{margin:0 0 4px;font-size:22px}
#gate p{margin:0 0 18px;color:var(--mute)}
#gate input{text-align:center;margin-bottom:12px}
#gate .btn{width:100%}
#gateErr{margin-top:12px;min-height:20px;color:var(--danger);font-size:14px}
#printArea{display:none}
#printArea .proto{font:13px/1.4 Arial,sans-serif;color:#000;background:#fff}#printArea h1{font-size:22px;margin:0 0 8px}#printArea h2{font-size:15px;margin:14px 0 4px}#printArea table{border-collapse:collapse;width:100%;margin:6px 0}#printArea td,#printArea th{border:1px solid #444;padding:4px 7px;text-align:left}#printArea img{max-width:100%;max-height:120mm;object-fit:contain;border:1px solid #888;background:#14181c}
@media print{#app,.backdrop,#toast,#gate,#verBadge{display:none!important}#printArea{display:block}body{background:#fff;height:auto}html{height:auto}}

<!--GATE-->
<div id="gate"><form id="gateForm" autocomplete="on">
  <img src="logo.png" alt="Tonfunk" onerror="this.remove()">
  <h1>Tonfunk Regelungstechnik-Lab</h1>
  <p id="gateHint">Bitte anmelden</p>
  <input id="gateName" type="text" placeholder="Vor- und Nachname" autocomplete="name" autocapitalize="words" autocorrect="off" spellcheck="false" aria-label="Name">
  <input id="gatePw" type="password" placeholder="Passwort" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Passwort">
  <button class="btn pri" type="submit">Öffnen</button>
  <div id="gateErr" role="alert"></div>
</form></div>
<script>
(function(){
  var H='a969a208b4df4a7c43c54c888590813046cf4c30f07efa9bb162c4aff6aabfba';
  var g=document.getElementById('gate');
  var pwOk=false,name='';
  try{pwOk=localStorage.getItem('lm4.gate')===H;name=localStorage.getItem('lm4.name')||'';}catch(e){}
  if(pwOk&&name){g.remove();return;}
  var f=document.getElementById('gateForm'),er=document.getElementById('gateErr'),pw=document.getElementById('gatePw'),nm=document.getElementById('gateName');
  nm.value=name;
  if(pwOk){pw.style.display='none';document.getElementById('gateHint').textContent='Bitte Namen eintragen';}
  async function sha(t){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}
  f.addEventListener('submit',async function(ev){
    ev.preventDefault();
    var n=nm.value.trim().replace(/\s+/g,' ');
    if(n.length<3||n.indexOf(' ')<0){er.textContent='Bitte Vor- und Nachnamen eintragen.';nm.focus();return;}
    if(!pwOk){
      if(!(window.crypto&&crypto.subtle)){er.textContent='Bitte die Seite über https öffnen.';return;}
      if(await sha(pw.value.trim())!==H){er.textContent='Passwort falsch.';pw.select();return;}
      try{localStorage.setItem('lm4.gate',H);}catch(_){}
    }
    try{localStorage.setItem('lm4.name',n);}catch(_){}
    g.remove();
  });
})();
</script>
