<style>
:root{--bg:#14181c;--panel:#222830;--panel2:#2c343e;--fg:#e8ecf0;--mute:#8d99a6;--accent:#3b9eff;--accent-bg:#1a6fd4;--danger:#ff5c5c;--line:#38424d;--ok:#4cd964;--warn:#ffb340;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.3 -apple-system,system-ui,"Segoe UI",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:4px;padding:calc(4px + env(safe-area-inset-top)) 8px 4px;background:var(--panel);border-bottom:1px solid var(--mute);min-height:52px;box-shadow:0 3px 10px rgba(0,0,0,.35);position:relative;z-index:5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
header img{height:34px;margin-left:2px}
header .title{flex:1;min-width:0;padding:0 8px;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
header .title small{display:block;color:var(--fg);opacity:.78;font-weight:500;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button[disabled]{opacity:.35;cursor:default}
.ib{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:20px}
.ib:active,.chip:active{background:var(--panel2)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hb{height:38px;padding:0 12px;border-radius:19px;background:var(--panel2);border:1px solid var(--mute);font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;margin:0 2px;flex:none}
.hb:active{background:var(--panel)}
@media(max-width:1100px){.hb span{display:none}.hb{padding:0 10px}}
@media(max-width:600px){header img,#bPrint,#bShare,#bOpen,#bEx,#bHome,#bNew,#bExp{display:none}}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:7px 10px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:40px;padding:0 15px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font:600 14px system-ui;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tab.on{background:var(--accent-bg,#1a6fd4);border-color:var(--accent-bg,#1a6fd4);color:#fff}
.tab .bd{min-width:18px;height:18px;border-radius:9px;background:#0003;font-size:12px;display:inline-grid;place-items:center;padding:0 5px}
#mid{display:flex;flex:1;min-height:0;position:relative}
.pg{display:none;flex-direction:column;min-width:0;min-height:0;flex:1;overflow:hidden}
#mid[data-tab=edit] #pgView,#mid[data-tab=stack] #pgView,#mid[data-tab=fab] #pgView,#mid[data-tab=asm] #pgView,#mid[data-tab=repair] #pgView,#mid[data-tab=tasks] #pgTasks,#mid[data-tab=help] #pgHelp{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:12px 12px 30px}
/* Statusleiste unten */
#pal{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);min-height:54px;scrollbar-width:thin;flex:none}
.chip{flex:none;height:40px;padding:0 13px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font-size:14px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip.on{background:var(--accent-bg,#1a6fd4);border-color:var(--accent-bg,#1a6fd4);color:#fff}
.chip.go{background:#1a7f37;border-color:#1a7f37;color:#fff;font-weight:700}
.chip.danger{color:var(--danger)}.chip.warnc{color:var(--warn);border-color:#c97a1a}.chip.bad{color:#ff8a7a;border-color:#a8433a}.chip.okc{color:var(--ok);border-color:#2b7a3a}
.chip.s{height:34px;padding:0 11px;font-size:13px}
.sep{flex:none;width:1px;height:26px;background:var(--line);margin:0 2px}
.seg{display:inline-flex;flex:none;border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.seg button{height:38px;padding:0 14px;background:var(--panel2);font-size:14px;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}.seg button.on{background:var(--accent-bg,#1a6fd4);color:#fff;font-weight:600}
#pgView{background:var(--bg)}
#taskBar{display:none;align-items:center;gap:8px;padding:6px 10px;background:rgba(59,158,255,.14);border-bottom:1px solid rgba(59,158,255,.45);flex:none}
#taskBar.on{display:flex}#taskBar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
#subBar{display:none;align-items:center;gap:6px;padding:6px 8px;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
#subBar.on{display:flex}#subBar::-webkit-scrollbar{display:none}
#viewHost{flex:1;min-height:0;position:relative;background:var(--bg)}
.vh{position:absolute;inset:0;display:none}.vh.on{display:block}
.vmount{width:100%;height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
.ph{padding:30px 20px;text-align:center;color:var(--mute)}.ph b{display:block;color:var(--fg);font-size:17px;margin-bottom:6px}.ph .btn{margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0;margin-bottom:10px;overflow:hidden}
.card>h4{list-style:none;margin:0;padding:0 12px;min-height:38px;display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);font-weight:600}
.card.pl{padding:12px}.card.pl h4{padding:0;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:600;text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--accent-bg,#1a6fd4);border-color:var(--accent-bg,#1a6fd4);color:#fff}.btn.danger{color:var(--danger)}.btn.s{height:36px;padding:0 12px;font-size:13px}
.btns{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.btns .btn{flex:1;min-width:120px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
/* Listen */
.tl{list-style:none;margin:10px 0 0;padding:0;font-size:13.5px}.tl li{padding:5px 0 5px 2px}.tl li.ok{color:var(--ok)}.tl li.bad{color:#ff8a7a}
.tl details{margin:3px 0 2px;color:var(--mute);font-size:12.5px}.tl summary{cursor:pointer;color:var(--accent);min-height:30px;display:flex;align-items:center}
.score{margin-top:8px;font-weight:700;color:#ffb340;font-size:16px}.score.ok{color:var(--ok)}
.gh{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);padding:14px 6px 4px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);min-height:48px;border-radius:0}.row:last-child{border:0}.row:active{background:var(--panel2)}
.row small{display:block;color:var(--mute);margin-top:1px}.row .grow{flex:1;min-width:0}
.dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px}.dot.g{background:var(--ok);border-color:var(--ok);color:#06210d}.dot.p{border-color:var(--warn);color:var(--warn);font-size:10px;font-weight:700}
.lv{color:var(--warn);letter-spacing:1px;font-size:12px}
.hint2{color:var(--mute);font-size:13px;margin:6px 0 0;line-height:1.4}
.big{font-size:20px;font-weight:700;margin:0 0 6px}
.badge{display:inline-block;padding:1px 8px;border-radius:9px;font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.badge.e{color:#ff8a7a;border-color:#a8433a}.badge.w{color:var(--warn);border-color:#c97a1a}.badge.g{color:var(--ok);border-color:#2b7a3a}
/* Hilfe */
.hl details{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:0 14px}.hl summary{min-height:48px;display:flex;align-items:center;font-weight:700;font-size:15.5px;cursor:pointer}
.hl .hb2{padding:0 0 12px;line-height:1.5;font-size:14.5px}.hl p{margin:.4em 0}.hl b{color:var(--accent)}.hl code,.code{font:600 12.5px ui-monospace,Menlo,Consolas,monospace;background:#10151a;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.hl table,.help table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}.hl td,.hl th,.help td,.help th{padding:6px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}.hl th{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.hl svg.tm{background:#10151a;border:1px solid var(--line);border-radius:8px;display:block;margin:6px 0;max-width:100%;height:auto}
.hl .tryit{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.calc{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin:8px 0}.calc label{flex:1;min-width:90px}.calc label span{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}.calc .res{flex:2;min-width:150px;font-size:15px;font-weight:700;color:var(--ok);padding-bottom:9px}
/* Fenster, Meldungen */
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;-webkit-user-select:text;user-select:text}
textarea{font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
label.f,div.f{display:block;margin:0 0 10px}label.f span,div.f>span{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;padding:9px 16px;border-radius:99px;z-index:300;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:700px){.backdrop{align-items:center}.sheet{border-radius:16px}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 6px 16px;border-bottom:1px solid var(--line);font-size:16px}
.sh-h button{width:40px;height:40px;font-size:18px;color:var(--mute)}
.sh-b{overflow:auto;padding:10px 14px 16px;-webkit-user-select:text;user-select:text}
.help p{margin:.5em 0}.help b{color:var(--accent)}
#gate{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#gate form{width:100%;max-width:340px;text-align:center}
#gate img{width:96px;height:auto;margin-bottom:10px}
#gate h1{margin:0 0 4px;font-size:22px}
#gate p{margin:0 0 18px;color:var(--mute)}
#gate input{text-align:center;margin-bottom:12px}
#gate .btn{width:100%}
#gateErr{margin-top:12px;min-height:20px;color:var(--danger);font-size:14px}
#printArea{display:none}
#printArea .proto{font:13px/1.4 Arial,sans-serif;color:#000;background:#fff}#printArea h1{font-size:22px;margin:0 0 8px}#printArea h2{font-size:15px;margin:14px 0 4px}#printArea table{border-collapse:collapse;width:100%;margin:6px 0}#printArea td,#printArea th{border:1px solid #444;padding:4px 7px;text-align:left}#printArea img{max-width:100%;max-height:150mm;object-fit:contain;border:1px solid #888;background:#14181c}
@media print{#app,.backdrop,#toast,#gate,#verBadge{display:none!important}#printArea{display:block}body{background:#fff;height:auto}html{height:auto}}
</style>

<body>
<!--GATE-->
<div id="gate"><form id="gateForm" autocomplete="on">
  <img src="logo.png" alt="Tonfunk" onerror="this.remove()">
  <h1>Tonfunk Leiterplatten-Lab</h1>
  <p id="gateHint">Bitte anmelden</p>
  <input id="gateName" type="text" placeholder="Vor- und Nachname" autocomplete="name" autocapitalize="words" autocorrect="off" spellcheck="false" aria-label="Name">
  <input id="gatePw" type="password" placeholder="Passwort" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Passwort">
  <button class="btn pri" type="submit">Öffnen</button>
  <div id="gateErr" role="alert"></div>
</form></div>
<script>
(function(){
  var H='a969a208b4df4a7c43c54c888590813046cf4c30f07efa9bb162c4aff6aabfba';
  var g=document.getElementById('gate');
  var pwOk=false,name='';
  try{pwOk=localStorage.getItem('lm4.gate')===H;name=localStorage.getItem('lm4.name')||'';}catch(e){}
  if(pwOk&&name){g.remove();return;}
  var f=document.getElementById('gateForm'),er=document.getElementById('gateErr'),pw=document.getElementById('gatePw'),nm=document.getElementById('gateName');
  nm.value=name;
  if(pwOk){pw.style.display='none';document.getElementById('gateHint').textContent='Bitte Namen eintragen';}
  async function sha(t){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}
  f.addEventListener('submit',async function(ev){
    ev.preventDefault();
    var n=nm.value.trim().replace(/\s+/g,' ');
    if(n.length<3||n.indexOf(' ')<0){er.textContent='Bitte Vor- und Nachnamen eintragen.';nm.focus();return;}
    if(!pwOk){
      if(!(window.crypto&&crypto.subtle)){er.textContent='Bitte die Seite über https öffnen.';return;}
      if(await sha(pw.value.trim())!==H){er.textContent='Passwort falsch.';pw.select();return;}
      try{localStorage.setItem('lm4.gate',H);}catch(_){}
    }
    try{localStorage.setItem('lm4.name',n);}catch(_){}
    g.remove();
  });
})();
</script>
<!--/GATE-->
<div id="app">

    <img id="logo" onclick="location.href='index.html'" title="Startseite" style="cursor:pointer" src="logo.png" alt="Tonfunk" onerror="this.remove()">

    <button class="ib" id="bUndo" aria-label="Rückgängig"><svg class="i" viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 010 10h-3" transform="translate(0 -3)"/></svg></button>
    <button class="ib" id="bRedo" aria-label="Wiederholen"><svg class="i" viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 000 10h3" transform="translate(0 -3)"/></svg></button>

  <nav id="tabs" role="tablist"></nav>

    <section class="pg scroll hl" id="pgHelp"><div class="wrap" id="helpView"></div></section>
  </div>
