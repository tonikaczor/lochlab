<script>
(function () {
  var LABS = [['loch', 'LochLab', 'layout.html', 0], ['sch', 'SchaltLab', 'schaltplan.html', 40], ['quarz', 'SchaltLab Quarzuhr', 'schaltplan.html', 0], ['sim', 'SimLab', 'simlab.html', 40], ['code', 'Arduino-Lab', 'codelab.html', 6], ['pi', 'Pi-Lab', 'pilab.html', 6], ['digi', 'DigiLab', 'digilab.html', 40], ['mess', 'MessLab', 'messlab.html', 40], ['haus', 'HausLab', 'hauslab.html', 40], ['app', 'App-Werkstatt', 'appwerkstatt.html', 40], ['pr', 'Prüfungs-Lab', 'pruefungslab.html', 40], ['sps', 'SPS-Lab', 'spslab.html', 40], ['pcb', 'Leiterplatten-Lab', 'pcblab.html', 8], ['ant', 'Antriebs-Lab', 'antlab.html', 10], ['sen', 'Sensorik-Lab', 'senlab.html', 10]];

  async function auditMess() {   // MessLab: Auswahlfragen stehen als Text in messdata.js und messpruef.js (right = Index der richtigen Antwort)
    var errs = [], hints = [], items = [];

  /* SchaltLab: Beispiel „Digitale Quarzuhr mit Wecker“ (gesperrt, quarzuhr.js). Logik aus quarzuhr-dev-tools.js (full, alarmTest), hier ohne die DEV-Datei. */
  function qzLint(W) {   // T-Kontakte (Drahtende liegt mitten auf einem anderen Draht) und überlappende Drähte verschiedener Linienzüge
    var segs = []; W.forEach(function (w, wi) { for (var i = 0; i + 3 < w.length; i += 2) segs.push({ wi: wi, x1: w[i], y1: w[i + 1], x2: w[i + 2], y2: w[i + 3] }); });

    var T = 0, O = 0;
    segs.forEach(function (a) { [[a.x1, a.y1], [a.x2, a.y2]].forEach(function (p) { segs.forEach(function (b) { if (b.wi !== a.wi && on(b, p[0], p[1])) T++; }); }); });
    function ov(a, b) {

      if (a.x1 === a.x2 && b.x1 === b.x2 && a.x1 === b.x1) return Math.min(Math.max(a.y1, a.y2), Math.max(b.y1, b.y2)) - Math.max(Math.min(a.y1, a.y2), Math.min(b.y1, b.y2)) > 0;
      return false;

    for (var i = 0; i < segs.length; i++) for (var j = i + 1; j < segs.length; j++) if (ov(segs[i], segs[j])) O++;

  async function labQuarz(l) {

        for (var n = 0; n < 250; n++) { E.run(0.004, []); var y = V(E, 'IC23', 9); hi = Math.max(hi, y); var b = y > 4.5 ? 1 : 0; if (b !== last) { tog++; last = b; } if (n % 10 === 9) await sleep(0); }

    var defs = [['load', 'Beispiel lädt, 147 Teile', ' Beispiel'], ['net', 'Netze: kein Kurzschluss +9 V/Masse, Wecker-Teile IC19–IC23, S4–S20, Q2, SPK1', ' Netzprüfungen'], ['wire', 'Drähte: keine bunten, kein T-Kontakt/Überlapp', ' Drähte'], ['alarm', 'Wecker 00:03: Summer nur bei Minute 3, nie mit S4 aus', ' Fälle']];
