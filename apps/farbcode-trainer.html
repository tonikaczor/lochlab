<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farbcode-Trainer</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#f4f6f9;color:#1b2230}h1{font-size:22px;margin:0 0 10px}button{font-size:17px;padding:10px 16px;margin:4px;border-radius:10px;border:0;background:#2b7de9;color:#fff}input{font-size:18px;padding:8px;width:120px;margin:4px;border-radius:8px;border:1px solid #9aa6b5}.box{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.15)}</style></head><body>
<h1>Widerstands-Farbcode</h1><div class="box"><p>Welche Zahl gehört zur Farbe?</p><p id="f" style="font-size:26px"></p><div id="z"></div><p id="r"></p></div>
<script>var C=[["schwarz",0],["braun",1],["rot",2],["orange",3],["gelb",4],["grün",5],["blau",6],["violett",7],["grau",8],["weiß",9]];var cur=0;function neu(){cur=Math.floor(Math.random()*10);document.getElementById("f").textContent=C[cur][0];var h="";for(var k=0;k<10;k++)h+='<button data-k="'+k+'">'+k+"</button>";document.getElementById("z").innerHTML=h;var bs=document.querySelectorAll("#z button");for(var j=0;j<bs.length;j++){bs[j].onclick=function(){document.getElementById("r").textContent=(+this.getAttribute("data-k")===C[cur][1])?"Richtig!":"Falsch, es ist "+C[cur][1];setTimeout(neu,900);};}}neu();</script></body></html>
