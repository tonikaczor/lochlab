<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spannungsfall-Rechner</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#f4f6f9;color:#1b2230}h1{font-size:22px;margin:0 0 10px}button{font-size:17px;padding:10px 16px;margin:4px;border-radius:10px;border:0;background:#2b7de9;color:#fff}input{font-size:18px;padding:8px;width:120px;margin:4px;border-radius:8px;border:1px solid #9aa6b5}.box{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.15)}</style></head><body>
<h1>Spannungsfall</h1><div class="box">Strom I in A: <input id="i" type="number"><br>Länge einfach in m: <input id="l" type="number"><br>Querschnitt in mm²: <input id="a" type="number"><br>Netzspannung in V: <input id="n" type="number"><br><button id="b">Berechnen</button><p>ΔU = <b id="du">-</b> V, das sind <b id="p">-</b> %</p></div>
<script>document.getElementById("b").onclick=function(){var i=+document.getElementById("i").value,l=+document.getElementById("l").value,a=+document.getElementById("a").value,n=+document.getElementById("n").value;var du=2*i*0.0178*l/a;document.getElementById("du").textContent=du.toFixed(2).replace(".",",");document.getElementById("p").textContent=(du/n*100).toFixed(1).replace(".",",");};</script></body></html>
