<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Elektrotechnik</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#f4f6f9;color:#1b2230}h1{font-size:22px;margin:0 0 10px}button{font-size:17px;padding:10px 16px;margin:4px;border-radius:10px;border:0;background:#2b7de9;color:#fff}input{font-size:18px;padding:8px;width:120px;margin:4px;border-radius:8px;border:1px solid #9aa6b5}.box{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.15)}</style></head><body>
<h1>Quiz: Elektrotechnik</h1><div class="box"><p id="q"></p><div id="a"></div><p id="r"></p></div><p id="s"></p>
<script>var Q=[["Wie heißt die Einheit der Spannung?",["Volt","Ampere","Ohm"],0],["Wie heißt die Einheit des Widerstands?",["Watt","Ohm","Volt"],1],["Welche Größe misst man in Ampere?",["Strom","Spannung","Leistung"],0],["Wie viel Volt hat die Steckdose in Deutschland?",["110","230","400"],1],["Was schützt Menschen vor Fehlerströmen?",["FI","Relais","Diode"],0],["Wie nennt man die Formel U = R · I?",["Ohmsches Gesetz","Kirchhoff","Faraday"],0],["Welche Einheit hat die Leistung?",["Watt","Joule","Henry"],0],["Wie viele Phasen hat Drehstrom?",["eine","zwei","drei"],2],["Welche Ader ist der Schutzleiter?",["blau","grün-gelb","braun"],1],["Was begrenzt den Strom einer LED?",["Vorwiderstand","Kondensator","Spule"],0]];var i=0,p=0;function show(){if(i>=Q.length){document.getElementById("q").textContent="Fertig!";document.getElementById("a").innerHTML="";document.getElementById("s").textContent=p+" von "+Q.length+" richtig";return;}document.getElementById("q").textContent=(i+1)+". "+Q[i][0];var h="";Q[i][1].forEach(function(t,k){h+='<button data-k="'+k+'">'+t+"</button>";});document.getElementById("a").innerHTML=h;document.getElementById("r").textContent="";var bs=document.querySelectorAll("#a button");for(var j=0;j<bs.length;j++){bs[j].onclick=function(){var k=+this.getAttribute("data-k");if(k===Q[i][2]){p++;document.getElementById("r").textContent="Richtig!";}else{document.getElementById("r").textContent="Leider falsch.";}i++;setTimeout(show,600);};}}show();</script></body></html>
