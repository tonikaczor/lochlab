<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zerspan-Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script>/* Darstellung wie die Startseite: Auto (Attribut fehlt) / Hell / Dunkel aus lm4.theme */
try{var th=localStorage.getItem('lm4.theme');if(th==='light'||th==='dark')document.documentElement.setAttribute('data-theme',th);}catch(e){}
</script>
<style>
:root{--bg:#14181c;--panel:#222830;--panel2:#2c343e;--fg:#e8ecf0;--mute:#8d99a6;--accent:#3b9eff;--accent-bg:#1a6fd4;--danger:#ff5c5c;--line:#38424d;--ok:#4cd964;--warn:#ffb340;color-scheme:dark;
  --sv-bg:#1b2229;--sv-wp:#9aa7b4;--sv-wp2:#6f7b87;--sv-ln:#e8ecf0;--sv-tool:#ffb340;--sv-chuck:#4a5663;--sv-bed:#2c343e;--sv-chip:#ff9f43;--sv-dim:#8d99a6;--sv-hole:#0d1115;--sv-cut:#3b9eff;--code-bg:#10151a}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f3f5f8;--panel:#ffffff;--panel2:#eaeef3;--line:#d3d9e0;--fg:#141a21;--mute:#5a6672;--accent:#0a4fb3;--accent-bg:#0a4fb3;--ok:#107a3f;--warn:#8a5a00;--danger:#b3261e;color-scheme:light;
  --sv-bg:#eef2f6;--sv-wp:#aeb9c4;--sv-wp2:#8995a1;--sv-ln:#1d2329;--sv-tool:#c77700;--sv-chuck:#b4bec8;--sv-bed:#d3d9e0;--sv-chip:#d9680d;--sv-dim:#5a6672;--sv-hole:#cfd6dd;--sv-cut:#0a4fb3;--code-bg:#eef2f6}}
:root[data-theme=light]{--bg:#f3f5f8;--panel:#ffffff;--panel2:#eaeef3;--line:#d3d9e0;--fg:#141a21;--mute:#5a6672;--accent:#0a4fb3;--accent-bg:#0a4fb3;--ok:#107a3f;--warn:#8a5a00;--danger:#b3261e;color-scheme:light;
  --sv-bg:#eef2f6;--sv-wp:#aeb9c4;--sv-wp2:#8995a1;--sv-ln:#1d2329;--sv-tool:#c77700;--sv-chuck:#b4bec8;--sv-bed:#d3d9e0;--sv-chip:#d9680d;--sv-dim:#5a6672;--sv-hole:#cfd6dd;--sv-cut:#0a4fb3;--code-bg:#eef2f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.3 -apple-system,system-ui,"Segoe UI",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:4px;padding:calc(4px + env(safe-area-inset-top)) 8px 4px;background:var(--panel);border-bottom:1px solid var(--mute);min-height:52px;box-shadow:0 3px 10px rgba(0,0,0,.2);position:relative;z-index:5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
header img{height:34px;margin-left:2px}
header .title{flex:1;min-width:0;padding:0 8px;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
header .title small{display:block;color:var(--fg);opacity:.78;font-weight:500;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button[disabled]{opacity:.35;cursor:default}
.ib{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:20px}
.ib:active,.chip:active{background:var(--panel2)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hb{height:44px;padding:0 12px;border-radius:22px;background:var(--panel2);border:1px solid var(--mute);font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;margin:0 2px;flex:none}
.hb:active{background:var(--panel)}
@media(max-width:1100px){.hb span{display:none}.hb{padding:0 10px}}
@media(max-width:600px){header img,#bHome{display:none}}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:7px 10px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:44px;padding:0 15px;border-radius:22px;background:var(--panel2);border:1px solid var(--line);font:600 14px system-ui;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tab.on{background:var(--accent-bg);border-color:var(--accent-bg);color:#fff}
.tab .bd{min-width:18px;height:18px;border-radius:9px;background:#0003;font-size:12px;display:inline-grid;place-items:center;padding:0 5px}
#mid{display:flex;flex:1;min-height:0;position:relative}
.pg{display:none;flex-direction:column;min-width:0;min-height:0;flex:1;overflow:hidden}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:12px 12px 30px}
#pal{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);min-height:56px;scrollbar-width:thin;flex:none}
.chip{flex:none;height:44px;padding:0 14px;border-radius:22px;background:var(--panel2);border:1px solid var(--line);font-size:14px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip.on{background:var(--accent-bg);border-color:var(--accent-bg);color:#fff}
.chip.go{background:#1a7f37;border-color:#1a7f37;color:#fff;font-weight:700}
.chip.danger{color:var(--danger)}
.chip.s{height:44px;padding:0 12px;font-size:13px}
.sep{flex:none;width:1px;height:26px;background:var(--line);margin:0 2px}
.seg{display:inline-flex;flex:none;border-radius:22px;overflow:hidden;border:1px solid var(--line)}
.seg button{height:44px;padding:0 14px;background:var(--panel2);font-size:14px;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}.seg button.on{background:var(--accent-bg);color:#fff;font-weight:600}
#stat{flex:none;font-size:12.5px;color:var(--mute);padding:0 4px;white-space:nowrap;font-variant-numeric:tabular-nums}
#stat b{color:var(--fg)}
#taskBar{display:none;align-items:center;gap:8px;padding:4px 10px;background:rgba(59,158,255,.14);border-bottom:1px solid rgba(59,158,255,.45);flex:none}
#taskBar.on{display:flex}#taskBar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0;margin-bottom:10px;overflow:hidden}
.card>summary,.card>h4{list-style:none;margin:0;padding:0 12px;min-height:44px;display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);font-weight:600;cursor:pointer}
.card>summary::-webkit-details-marker{display:none}
.card>summary::after{content:"▾";margin-left:auto;font-size:13px}.card:not([open])>summary::after{content:"▸"}
.card .cb{padding:0 12px 12px}
.card.warn{border-color:#c97a1a}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 6px}
table.iot{width:100%;border-collapse:collapse;font-size:13px}.iot td,.iot th{padding:6px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}.iot th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}.iot td.a{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}.iot td.v{white-space:nowrap;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:600;text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--accent-bg);border-color:var(--accent-bg);color:#fff}.btn.danger{color:var(--danger)}.btn.s{min-height:44px;padding:0 12px;font-size:13px}
.btns{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.btns .btn{flex:1;min-width:120px}
.gh{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);padding:14px 6px 4px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);min-height:52px;border-radius:0}.row:last-child{border:0}.row:active{background:var(--panel2)}
.row small{display:block;color:var(--mute);margin-top:1px}.row .grow{flex:1;min-width:0}
.dot{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px}.dot.g{background:var(--ok);border-color:var(--ok);color:#06210d}.dot.p{border-color:var(--warn);color:var(--warn);font-size:10px;font-weight:700}
.lv{color:var(--warn);letter-spacing:1px;font-size:12px}
.hint2{color:var(--mute);font-size:13px;margin:6px 0 0;line-height:1.4}
.big{font-size:20px;font-weight:700;margin:0 0 6px}
.hl details{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:0 14px}.hl summary{min-height:48px;display:flex;align-items:center;font-weight:700;font-size:15.5px;cursor:pointer}
.hl .hb2{padding:0 0 12px;line-height:1.5;font-size:14.5px}.hl p{margin:.4em 0}.hl b{color:var(--accent)}.hl code,.code{font:600 12.5px ui-monospace,Menlo,Consolas,monospace;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.hl table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}.hl td,.hl th{padding:6px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}.hl th{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.hl .tryit{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;-webkit-user-select:text;user-select:text;min-height:44px}
label.f{display:block;margin:0 0 10px}label.f span{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;color:#fff;padding:9px 16px;border-radius:99px;z-index:300;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:700px){.backdrop{align-items:center}.sheet{border-radius:16px}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 6px 16px;border-bottom:1px solid var(--line);font-size:16px}
.sh-h button{width:44px;height:44px;font-size:18px;color:var(--mute)}
.sh-b{overflow:auto;padding:10px 14px 16px;-webkit-user-select:text;user-select:text}
#gate{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#gate form{width:100%;max-width:340px;text-align:center}
#gate img{width:96px;height:auto;margin-bottom:10px}
#gate h1{margin:0 0 4px;font-size:22px}
#gate p{margin:0 0 18px;color:var(--mute)}
#gate input{text-align:center;margin-bottom:12px}
#gate .btn{width:100%}
#gateErr{margin-top:12px;min-height:20px;color:var(--danger);font-size:14px}
/* ===== Zerspan-Lab ===== */
#mid[data-tab=dreh] #pgDreh,#mid[data-tab=fraes] #pgFraes,#mid[data-tab=bohr] #pgBohr,#mid[data-tab=tafel] #pgTafel,#mid[data-tab=tasks] #pgTasks,#mid[data-tab=train] #pgTrain,#mid[data-tab=fehler] #pgFehler,#mid[data-tab=help] #pgHelp{display:flex}
.sim-grid{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.sim-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}}
.simL{position:sticky;top:0;z-index:3;margin-bottom:0}
@media(max-width:899px){.simL{margin:0 -12px;border-radius:0;border-left:0;border-right:0}}
svg.sim{width:100%;height:auto;display:block;background:var(--sv-bg)}
svg.sim text{font:600 14px system-ui,sans-serif;fill:var(--sv-dim)}
svg.sim .wl{stroke:var(--sv-ln);stroke-width:1.1}
.live{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
.kv{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 4px;text-align:center;min-width:0}
.kv small{display:block;color:var(--mute);font-size:11px;white-space:nowrap}
.kv b{display:block;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv b i{font-style:normal;font-size:10.5px;color:var(--mute);font-weight:600}
.kv.ok b{color:var(--ok)}.kv.hoch b,.kv.niedrig b{color:var(--warn)}
@media(max-width:520px){.live{gap:4px;padding:6px}.kv{padding:4px 2px}.kv small{font-size:10.5px}.kv b{font-size:14.5px}.kv b i{display:block;line-height:1.1}}
.simbar{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:0 8px 8px;font-size:12px;color:var(--mute)}
.ctl{margin:0 0 8px}
.ctl-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ctl-h label{font-size:13.5px;font-weight:600}
.ctl-v{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;white-space:nowrap}
.ctl-v input{width:92px;min-height:44px;text-align:right;padding:4px 8px}
.ctl input[type=range]{width:100%;min-height:44px;padding:0;margin:0;border:0;background:none;accent-color:var(--accent-bg)}
.ctl select{margin-top:2px}
.ctl.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.ctl.chk input{width:24px;height:24px;min-height:0;flex:none}
.ctl.chk label{font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.win{margin:8px 0 2px}
.win .tr{position:relative;height:14px;border-radius:7px;background:var(--panel2);border:1px solid var(--line)}
.win .zone{position:absolute;top:0;bottom:0;background:rgba(76,217,100,.35);border-left:2px solid var(--ok);border-right:2px solid var(--ok)}
.win .mk{position:absolute;top:-4px;width:4px;height:20px;border-radius:2px;background:var(--fg);transform:translateX(-2px)}
.win p{margin:4px 0 0;font-size:13px}
.win p.ok{color:var(--ok)}.win p.niedrig,.win p.hoch{color:var(--warn)}
.rw{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin:8px 0}
.rw button{height:52px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.rw button small{font-weight:500;font-size:10.5px;color:var(--mute)}
.rw button.inw{border-color:var(--ok);background:rgba(76,217,100,.16)}
.rw button.on{background:var(--accent-bg);border-color:var(--accent-bg);color:#fff}.rw button.on small{color:#fff}
.rw button.ok{border-color:var(--ok);background:rgba(76,217,100,.3)}.rw button.bad{border-color:var(--danger);background:rgba(255,92,92,.22)}
.rw button[disabled]{opacity:1}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.qcard .qt{font-size:15.5px;line-height:1.45;margin:8px 0 12px}
.qcard .qm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.qcard .qm .tag{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.qin{display:flex;gap:8px;align-items:center}.qin input{flex:1;min-width:0}.qin .u{flex:none;min-width:48px;color:var(--mute);font-size:15px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;min-height:48px;padding:9px 12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);font-size:14.5px;line-height:1.3}
.opts button.on{border-color:var(--accent);background:rgba(59,158,255,.2)}
.opts button.ok{border-color:var(--ok);background:rgba(76,217,100,.2)}
.opts button.bad{border-color:var(--danger);background:rgba(255,92,92,.18)}
.opts button[disabled]{opacity:1}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:14px;line-height:1.45}
.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--danger)}
.fb ol{margin:6px 0 0;padding-left:20px}.fb li{margin:3px 0}
.fb .res{font-weight:700}
.stbar{height:8px;background:#0006;border-radius:4px;overflow:hidden;margin:6px 0}.stbar i{display:block;height:100%;background:var(--ok)}
.boxes{display:flex;gap:6px;margin:8px 0}
.boxes .bx{flex:1;text-align:center;font-size:12px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 2px}
.boxes .bx b{display:block;font-size:17px;color:var(--fg)}
.fbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.badge-exam{display:inline-block;background:rgba(255,179,64,.18);border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:1px 8px;font-size:12px;font-weight:600}
@media print{#app,.backdrop,#toast,#gate,#verBadge{display:none!important}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
